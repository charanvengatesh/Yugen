# The shallow and cavern bands: the first real underground, 8..210 cells below
# the local surface row. Authoring rules are in content/mobs/surface.mob and the
# full rationale in tools/contentc/schema/mob.ts.
#
# HABITAT MODEL. A creature is eligible at a candidate cell when its depth band
# matches, the depth is inside any explicit minDepth/maxDepth window, the
# dominant biome is in its list (absent = anywhere), and any extra predicate
# (needsLava) holds. Eligible defs are then picked by weight — population
# composition follows the terrain, and there is no per-biome spawn table to keep
# in sync with the world generator.
#
# ---- ADDRESSING THE UNDERGROUND LAYERS -------------------------------------
# `biomes` names a SURFACE biome, and the six underground layers in
# crates/godgame-core/src/sim/biomes.rs (caverns, grottos, magma, geode, fungal,
# rime) are chosen from their own climate field at their own frequency — so a
# Desert can sit on top of flooded grottos and nothing in a `biomes` list can
# express "down there".
# Until the spawn picker learns about layers, a creature is fitted to one by the
# predicates that already exist and that the layer's own definition implies:
#
#   magma    `needsLava` + `lavaImmune` — the layer whose pocket liquid IS lava
#   grottos  a depth window in the flooded band, `gravityScale 0` to swim it
#   geode    a deep window, and immunities that match a body made of crystal
#   fungal   a deep window and `immune poison acid` — the layer pools acid
#   rime     NOTHING YET. The layer is newer than this list and no creature here
#            is fitted to it, so the Rime Hollows are populated only by whatever
#            the depth bands place everywhere. Wanting something that belongs to
#            the ice specifically means a new creature, not a new predicate.
#
# That is a fit, not a gate: a slagworm can in principle surface in a dry deep
# tunnel that happens to have lava nearby. Making it exact needs a `layers`
# field on this schema AND a read of the layer id in the spawner, which is one
# change across two owners rather than one, and is called out as such rather
# than half-built here.

# --- Slime ------------------------------------------------------------------
# A wobbling blob that hops. No biome list: it is the one creature that belongs
# everywhere underground, and the band pair (not the biome) is what places it.
# The short beat makes it a rhythm to time rather than a chase to outrun.
[slime]
name = "Slime"
brain = "hopper"
maxHealth = 20.0
contactDamage = 10.0
bodyCellsW = 3
bodyCellsH = 2
speed = 190.0
jumpSpeed = 640.0
aggroPx = 145.0
aggroYPx = 70.0
beat = 1.05
blood = "#49b077"
xp = 5
value = 2
drops = [{ item = "slime_gel", count = [1, 2] }]
bands = ["shallow", "cavern"]
weight = 20.0
# A blob has no limbs, so every frame is a change of VOLUME: the idle squashes
# and rises, and the air pose compresses at launch and stretches at the apex.
# `grain = 2` is spent entirely on that, because volume is the only thing this
# creature can say: the crown now rises a HALF cell and the mass drops into the
# base without the silhouette jumping a whole world cell, which is what the old
# 3x2 version could only fake by blanking a row.
# The palette is UNCHANGED and did not need to change — the dark base (1), the
# flank (2), the body (3) and the surface sheen (4) were already a four-step
# vertical ramp with nowhere to put it, and the finer grid is that place: 4 on
# the crown, 3 through the belly, 1 under the contact edge, every frame.
art.cellsW = 3
art.cellsH = 2
art.grain = 2
art.pal = [".", "#1e4a34", "#2c6f4a", "#49b077", "#a8f0c4"]
art.fps = 6.0
[[slime.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 3.1
blinkFor = 0.16
frames = '''
..44..
.3443.
333333
122221

......
333333
333333
122221

.4444.
344443
333333
122221
'''
[[slime.art.seq]]
state = "move"
mode = "loop"
frames = '''
......
333333
333333
122221

..44..
.3443.
233332
122221

..33..
.3333.
333333
122221
'''
[[slime.art.seq]]
state = "air"
mode = "once"
fps = 9.0
frames = '''
..44..
..33..
.3333.
.1221.

44..44
443344
333333
122221
'''


# --- Cave bat ---------------------------------------------------------------
# The only species eligible in every band, so its weight is held down to stop
# caves reading as nothing but bats. Nocturnal, which at the surface multiplies
# its weight by darkness — underground the multiplier is 1, because a cave is
# dark at noon.
[bat]
name = "Cave Bat"
brain = "flyer"
maxHealth = 10.0
contactDamage = 6.0
attackCooldown = 0.7
bodyCellsW = 3
bodyCellsH = 2
speed = 200.0
chaseSpeed = 360.0
gravityScale = 0.0
aggroPx = 170.0
aggroYPx = 130.0
beat = 0.9
blood = "#4a3d5c"
xp = 3
drops = [{ item = "bat_wing", count = 1, chance = 0.4 }]
bands = ["surface", "shallow", "cavern", "deep"]
nocturnal = true
weight = 12.0
# A FOUR-frame wingbeat, which is the whole reason this redraw exists: the old
# two-frame version was up/down with nothing between, so at 14fps it strobed.
# Up, mid, down, mid gives the beat a direction, and the mid frames use the
# darker wing tone (2) so the wing reads as edge-on rather than as half-erased.
# `grain = 2` buys the one thing the 3x2 version could not draw: the down-stroke
# now goes BELOW the body line instead of stopping level with it, so the beat
# has travel on both sides of the shoulder rather than only above it. It also
# finally uses tone 1 — the deepest ink was never painted before, and it is now
# the tucked feet, so the sprite is lit at the head and dark at the bottom edge.
# `air` is the dive: wings folded flush to the body, nothing above and nothing
# below, which is unmistakable against a pose whose whole identity is wings.
art.cellsW = 3
art.cellsH = 2
art.grain = 2
art.pal = [".", "#1a1424", "#2a2233", "#4a3d5c", "#ff9a6b"]
art.fps = 14.0
[[bat.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 3.6
blinkFor = 0.12
frames = '''
33..33
.2332.
.3443.
..11..

......
333333
.3443.
..11..

33..33
.2332.
.3223.
..11..
'''
[[bat.art.seq]]
state = "move"
mode = "loop"
frames = '''
3....3
33..33
.3443.
..11..

......
22..22
.3443.
..11..

......
......
334433
3.11.3

......
22..22
.3443.
..11..
'''
[[bat.art.seq]]
state = "air"
mode = "hold"
frames = '''
......
.3333.
.3443.
..11..
'''


# --- Stoneback --------------------------------------------------------------
# The armour test. 8 flat reduction against a PUNCH_DAMAGE of 5 means bare fists
# do the floored minimum of 1 per swing — it is not unkillable, it is a creature
# that tells you to go and find a pick. Slow, short-sighted and non-committal
# (no jumpSpeed, so it will not follow you off a ledge); the threat is entirely
# that it is standing between you and the ore.
[stoneback]
name = "Stoneback"
brain = "walker"
maxHealth = 55.0
contactDamage = 14.0
attackCooldown = 1.2
armor = 8.0
immune = ["impact"]
bodyCellsW = 4
bodyCellsH = 3
speed = 80.0
chaseSpeed = 130.0
aggroPx = 110.0
aggroYPx = 55.0
beat = 3.2
blood = "#6e6e6e"
xp = 18
value = 10
drops = [
    { item = "stone_chunk", count = [2, 4] },
    { item = "iron_ore", count = [1, 2], chance = 0.45 },
    { item = "gem", count = 1, chance = 0.08 },
]
bands = ["cavern", "deep"]
weight = 9.0
# Forty-eight texels and twelve of them are legs, so this is the one creature
# with room for a real quadruped gait — and at `grain = 2` it is a literal one:
# FOUR separate legs at columns 0, 2, 5 and 7, two rows tall, instead of two leg
# cells asked to imply four. The four documented footfalls survive intact —
# planted, front pair, passing, rear pair — with both contacts (frames 0 and 2)
# putting all four feet on the bottom row, exactly like the player's run.
# A heavy thing should look like its mass is being carried, and the way to say
# that is still that the top two thirds are completely still: rows 0..3 are one
# frozen shell in every `move` frame. The shell is what the finer grid actually
# improved — a lit crown (4) over a body course (3) over a shaded lower flank
# (2), which is a carapace curving away from the light rather than a grey bar.
art.cellsW = 4
art.cellsH = 3
art.grain = 2
art.pal = [".", "#262626", "#3a3a3a", "#6e6e6e", "#8f8f8f", "#b8b8b8"]
art.fps = 4.0
