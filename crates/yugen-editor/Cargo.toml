[package]
name = "yugen-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authoring tools for content/: a pixel editor, and the splices that edit a record without rewriting its file."
publish = false

# This crate ships two binaries — the window, and `yugen-fit`, which does a
# resize from the command line. Two is enough to make `cargo run -p yugen-editor`
# ambiguous, and that spelling is the one `docs/EDITOR.md` documents and the one
# anybody who has used this tool already has in their shell history. The window
# is what "run the editor" means; the batch tool is a thing you ask for by name.
default-run = "yugen-editor"

[dependencies]
# The TOML front end `contentc` already uses. Used to LOCATE and READ records —
# never to write them. See `src/splice.rs` for why a serializer is the wrong tool
# for the write side.
toml = "0.9"

# The window. `eframe` and not Bevy, deliberately: this crate must not link
# `yugen-render`, because the renderer bakes from COMPILED content and an editor
# has to draw the file as it is being typed — before `contentc` has run, and
# while it may not even be valid. Sharing a window stack with the game would buy
# nothing and cost the whole engine.
#
# Pinned to 0.35 rather than 0.36 by the workspace `rust-version`: 0.36 wants
# rustc 1.95. Default features, so the backend is wgpu — which the workspace
# already builds for Bevy, so it is a cache hit rather than a second stack.
eframe = "0.35"

# The speaker. `playback` only — no decoders, because nothing here decodes: the
# editor synthesises samples from the parameters on screen and hands them
# straight to the mixer. The default features would pull in symphonia to read
# file formats this crate never opens.
#
# rodio is what Bevy already plays audio through, so the version is matched to
# the one in the lock and costs no second audio stack.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
