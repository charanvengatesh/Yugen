]
bands = ["deep"]
minDepth = 200
weight = 6.0
# The blade is the RIGHT-HAND COLUMNS, held bright down the full height of the
# sprite, and it is what tells this apart from the sentinel at a glance: same
# machine palette, same legs, but one of them is symmetrical and one of them is
# carrying something on its leading edge. Its optic sits red in every ground
# frame where the sentinel's only goes red as a tell, and the idle's breath is
# that optic dropping to body tone and back. The interrupt lights the blade
# along its length rather than changing the optic — the sentinel's tell means
