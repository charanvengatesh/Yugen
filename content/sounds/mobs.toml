# What creatures do. Paired with `MobEventKind`, which has four arms; `chill`
# has no sound because it is a state a creature enters rather than a moment,
# and a sound for it would fire on a frame the player cannot connect it to.

[mob_hurt]
name = "Creature hurt"
# Higher and shorter than the player's own, so the two are never confused in a
# fight. Whose health bar moved is information.
wave = "saw"
hz = 620.0
hzTo = 260.0
seconds = 0.11
release = 0.6
noise = 0.25
gain = 0.4

[mob_die]
name = "Creature dies"
# Longer, lower, and further down: the same shape as being hurt, taken to its
# end. A death that sounded unrelated to the hits before it would read as a
# separate event.
wave = "saw"
hz = 480.0
hzTo = 90.0
seconds = 0.3
release = 0.7
noise = 0.35
gain = 0.5

[player_hit]
name = "Creature hits you"
# The impact, not the wound — `hurt` in `player.toml` is the wound, and both
# fire on the same event. This is the contact and it is short enough to read as
# the front of that pair.
wave = "square"
hz = 200.0
hzTo = 140.0
seconds = 0.07
release = 0.5
noise = 0.5
gain = 0.45
