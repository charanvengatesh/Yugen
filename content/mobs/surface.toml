# Surface and near-surface creatures: what you meet before you start digging.
#
# READ THE NUMBERS IN THE PLAYER'S FRAME. speed/jumpSpeed/gravityScale are
# authored as if this creature were the 24px reference character the player's
# physics were tuned against; src/entities/mobs/MobDefs.ts multiplies them by
# PHYS_SCALE * (bodyCellsH * CELL / PLAYER_H) at load. So `speed 110` here means
# "about a third of the player's MAX_RUN_SPEED 360, relative to its own body",
# and it stays true if movement is ever retuned. Radii (aggroPx, fleePx,
# ranged.range) are NOT scaled — they are about how far away something notices
# you on screen, which is a property of the camera, not of its legs.
# Full rationale: tools/contentc/schema/mob.ts.
#
# ART: one character is one WORLD CELL. A pose is one `art.seq` record whose
# heredoc body holds every frame of that loop, frames separated by a blank line.
# Sizes run 2x2 to 4x3 cells (10x10 to 20x15 px) against a 2x3 player — the
# range where a creature reads as a creature at a 5px cell.
#
# BODY vs ART. bodyCellsW/bodyCellsH are the collision box and the body-scale
# anchor; art.cellsW/art.cellsH are only how big the picture is. No bodyCells*
# value was touched by the art pass, which is what `npm run verify:mobs` asserts.
#
# The pads have since landed: MobDefs.ts derives `wPx`/`hPx` from bodyCells* and
# `artWPx`/`artHPx`/`artPadXPx`/`artPadTopPx` from the sprite, so art may now
# overhang the body — horns, wings, a plume — without widening the hitbox. Every
# creature here still keeps the two EQUAL, because the redraw predated the pads
# and staying square was the conservative choice; growing one is now a pure art
# edit. Two rules the facade enforces at load: art may never be SMALLER than the
# body in either axis (that is a hole in the hitbox), and artCellsW - bodyCellsW
# must be even, or the centred pad puts sprite pixels half a cell off the grid.
#
# ---- WHAT THE PLAY MODES BOUGHT --------------------------------------------
# Every pose used to be `loop`, so an idle was a two-frame twitch and a jump was
# the same two frames going round forever. The vocabulary is now:
#
#   ambient  IDLE. frames[0..n-2] alternate as a breath; the LAST frame is an
#            interrupt held for `blinkFor` every `blinkEvery`. That last frame
#            is used as a TELL wherever a creature has one — the sentinel's
#            optic going red, the bladeframe's edge lighting up, the moth
#            flaring before it spits. A player who watches the room now gets
#            warning, and it cost no code.
#   phase    GROUND LOCOMOTION. Indexed by real horizontal speed instead of by
#            wall-clock, so a creature that has a chaseSpeed does not keep
#            patrol-rate legs while it charges. Four frames, contacts on the
#            first and third, exactly like the player's run.
#   loop     Anything whose rhythm is genuinely its own and not its feet: wing
#            beats, a swim undulation, a hopper's shuffle.
#   once     AIR, on anything that leaves the ground under its own power —
#            launch, then the apex frame is HELD until it lands.
#   hold     AIR on things that only ever fall, and any pose that is one frame.
#
# NO `fps=` ON AN IDLE, ANYWHERE. The facade halves the idle rate for every
# creature at once; setting a rate here to compensate would bake that decision
# into 21 files. `art.fps` is tuned so both the full-rate move and the halved
# idle read, and that is the only rate knob these files touch.

# --- Grubling ---------------------------------------------------------------
# Armoured surface crawler. The baseline hostile: slow patrol, real charge,
# short notice radius, so it is a threat you walk into rather than one that
# hunts you across a field. Its chitin is the first armour the player meets.
[grubling]
name = "Grubling"
brain = "walker"
maxHealth = 14.0
contactDamage = 8.0
armor = 1.0
bodyCellsW = 4
bodyCellsH = 4
speed = 110.0
chaseSpeed = 215.0
aggroPx = 130.0
aggroYPx = 40.0
beat = 2.4
blood = "#a9753d"
xp = 4
value = 2
drops = [
    { item = "chitin", count = [1, 2] },
    { item = "grub_meat", count = 1, chance = 0.35 },
]
bands = ["surface", "shallow"]
biomes = ["plains", "savanna", "jungle", "swamp", "tundra", "desert"]
weight = 26.0
# Sixteen pixels now, and the shell is still the whole creature: rows 0-1 are
# the domed plate, row 2 is its shaded rim, row 3 is the leg fringe, and every
# frame differs only in which of those is doing something. The ink tone (1)
# still pulls the legs out of the shell, and the added rim tone (5) is what the
# finer grid earned — a brown darker than the plate but lighter than the leg
# ink, so the shell can round off underneath without fusing with its own feet.
# Facing is still carried by the dark-rear-to-lit-front gradient the two-pixel
# plate had; the notched top corners are the only thing here that is shape
# rather than shading. It does not glow, so 4 stays exactly what it was — the
# interrupt, and nothing else.
art.cellsW = 4
art.cellsH = 4
art.grain = 1
art.pal = [".", "#3a2617", "#6f4a2a", "#a9753d", "#ffd27a", "#4e321c"]
art.fps = 7.0
[[grubling.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 3.4
blinkFor = 0.14
frames = '''
.33.
2233
5555
1111

.22.
2222
5555
1111

.44.
3344
5555
1111
'''
# Contacts still land on the first and third frames, but at this grain the
# fringe gaps ALTERNATE TEXELS instead of half the creature, so a crawler
# crawls rather than rocking end to end.
[[grubling.art.seq]]
state = "move"
mode = "phase"
frames = '''
.33.
2233
5555
1.1.

.33.
2233
5555
1111

.33.
2233
5555
.1.1

.33.
2233
5555
1111
'''
# No jumpSpeed, so this pose only ever means "walked off something": the fringe
# goes entirely and the rim stays, the same tuck the two-pixel version drew by
# emptying one row.
[[grubling.art.seq]]
state = "air"
mode = "hold"
frames = '''
.33.
2233
5555
....
'''


# --- Critter ----------------------------------------------------------------
# Small, bright, harmless, panics. fleePx (not aggroPx) is what flips the walker
# brain into running away; the very high chaseSpeed is its bolt, not a charge.
# It exists to make a meadow feel occupied and to be the thing you chase for
# hide, so it is worth nothing to fight and something to catch.
[critter]
name = "Critter"
brain = "skitter"
maxHealth = 6.0
contactDamage = 0.0
bodyCellsW = 4
bodyCellsH = 4
speed = 120.0
chaseSpeed = 330.0
jumpSpeed = 560.0
fleePx = 105.0
beat = 1.6
blood = "#f2e3c8"
xp = 1
drops = [{ item = "hide", count = 1, chance = 0.6 }]
bands = ["surface"]
biomes = ["plains", "savanna", "jungle", "swamp", "tundra", "glacier"]
weight = 22.0
# Head high, body low: the top-left QUADRANT is empty in most frames, which is
# still the entire silhouette — a small thing with its head up. The finer grid
# buys that head a face it could not have at four pixels: an ink eye (1) at the
# back of the skull, a muzzle at the front, an ear tip that pricks up as ONE
# texel above the shoulder line (frame 1 of the idle), and a nose that flares
# pink across the whole muzzle (the interrupt). Both are still alarm, and they
# are still the only two things a prey animal this small has to say. The near
# leg now swings through the four-frame cycle instead of jumping between two
# cells — extended back on 0, extended forward on 2, under the body on the
# passes — so the contacts still land on the first and third. The added tone (5)
# is a fur shade between the mid (2) and the ink (1), so the belly can sit in
# shadow and the feet still read dark against it.
art.cellsW = 4
art.cellsH = 4
art.grain = 1
art.pal = [".", "#3a2c22", "#c8b7a0", "#f2e3c8", "#ff9a9a", "#8a7660"]
art.fps = 12.0
[[critter.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 2.6
blinkFor = 0.12
frames = '''
..13
..33
2222
1551

.213
..33
2222
1551

..13
..44
2222
1551
'''
[[critter.art.seq]]
state = "move"
mode = "phase"
frames = '''
..13
..33
2222
1555

..13
..33
2222
5155

..13
..33
2222
5551

..13
..33
2222
5515
'''
# A bound, not a fall: launch with the feet already gone, then the stretched
# apex is held until it lands. At this grain the stretch is an actual diagonal —
# the mass fills the top row and vacates the bottom-rear over two steps instead
# of one — but it is the same move.
[[critter.art.seq]]
state = "air"
mode = "once"
fps = 14.0
frames = '''
..13
..33
2222
5555

2213
2233
.222
..55
'''


# --- Sandworm ---------------------------------------------------------------
# Travels inside the rock line and erupts. The long beat is the whole design:
# a burrower that surfaced often would just be a walker with a worse silhouette.
# Restricted to loose ground (sand, savanna hardpan, snow, ice) because a worm
# swimming through granite reads as a bug rather than as a creature.
[sandworm]
name = "Sandworm"
brain = "burrower"
maxHealth = 30.0
contactDamage = 16.0
attackCooldown = 1.0
armor = 2.0
bodyCellsW = 8
bodyCellsH = 4
speed = 150.0
chaseSpeed = 210.0
jumpSpeed = 700.0
aggroPx = 190.0
aggroYPx = 110.0
beat = 2.8
blood = "#c39a5a"
xp = 12
value = 6
drops = [
    { item = "worm_hide", count = [1, 2] },
    { item = "chitin", count = [1, 3], chance = 0.5 },
]
bands = ["surface", "shallow"]
biomes = ["desert", "savanna", "tundra", "glacier"]
weight = 10.0
# The back is a fixed banded gradient and the BELLY is what animates: a contact
# patch travelling down the underside, four texels of bulge (1) over a two-texel
# pressed line (6). That is peristalsis, it is the one gait a legless thing has,
# and at eight texels long you can now see the patch flatten where it takes the
# worm's weight instead of just switching cells on and off. The finer grid also
# rounds the tube: row 0 is the lit ridge, row 1 is the same bands one step
# down, rows 2-3 are the shadowed underside — which is what the added tone (6)
# is for, a brown below the darkest band so the flank and the belly can sit
# UNDER the ridge instead of beside it. The maw (5) still appears only on the
# idle's interrupt and on the eruption, now a two-by-two block filling the head,
# so seeing red still means it is about to matter.
art.cellsW = 8
art.cellsH = 4
art.grain = 1
art.pal = [".", "#6b4a24", "#8a6a3c", "#c39a5a", "#e8cf9a", "#ff6b57", "#4a3117"]
art.fps = 8.0
[[sandworm.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 4.2
blinkFor = 0.18
frames = '''
11223311
66112266
11....11
.6....6.

11222211
66111166
11....11
.6....6.

11223355
66112255
11....11
.6....6.
'''
[[sandworm.art.seq]]
state = "move"
mode = "phase"
frames = '''
11223344
66112233
1111....
.66.....

11223344
66112233
..1111..
...66...

11223344
66112233
....1111
.....66.

11223344
66112233
..1111..
...66...
'''
[[sandworm.art.seq]]
state = "air"
mode = "once"
fps = 10.0
frames = '''
11223355
66112255
........
........

11223344
66112233
........
........
'''


# --- Frostmite --------------------------------------------------------------
# The first pack animal: individually trivial (7hp, 5 damage), but packSize 2..4
# means a glacier ridge produces a small skittering line of them and the fight
# is about spacing rather than about any one of them. Immune to ice so it can
# live in the material it is made of — walking over packed ice is not supposed
# to be what kills it. Held to the top 40 cells so it stays a surface-weather
# creature and does not leak into the cavern band via `shallow`.
[frostmite]
name = "Frostmite"
brain = "walker"
maxHealth = 7.0
contactDamage = 5.0
attackCooldown = 0.6
bodyCellsW = 4
bodyCellsH = 4
speed = 140.0
chaseSpeed = 260.0
jumpSpeed = 480.0
aggroPx = 120.0
aggroYPx = 45.0
beat = 1.2
immune = ["ice"]
blood = "#7fd4e8"
xp = 2
drops = [{ item = "ice_shard", count = [1, 2], chance = 0.45 }]
bands = ["surface", "shallow"]
maxDepth = 40
biomes = ["glacier", "tundra"]
packSize = [2, 4]
weight = 18.0

# A frost spike over a low body — and the creature the whole fleet's grain
# decision was made on. This was the game's one `grain = 2` experiment, drawn
# first so the question "does finer art read as pasted onto a chunkier world,
# or just better?" could be answered by standing it next to a grubling and
# looking. The answer was better, the fleet followed, and every creature is at
# grain 2 now, and the player followed the fleet — but the TERRAIN is not and
# is not going to be: a cell is the unit the simulation thinks in, and rock
# drawn finer than it is simulated lies about where a pickaxe lands. The schema
# doc on `grain` still says what stops the field drifting further.
#
# The drawing keeps what the 2x2 version established: the spike dulls and
# brightens on the breath and flares across the whole crown on the interrupt,
# so a LINE of these twinkles out of step with itself — which is what makes a
# pack read as several animals rather than as one animal drawn four times.
art.cellsW = 4
art.cellsH = 4
art.grain = 1
art.pal = [".", "#2a5570", "#3c6f8a", "#7fd4e8", "#eaffff"]
art.fps = 11.0
[[frostmite.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 2.2
blinkFor = 0.1
frames = '''
..3.
..33
2332
1221

..4.
..43
2332
1221

.44.
4334
2332
1221
'''
[[frostmite.art.seq]]
state = "move"
mode = "phase"
frames = '''
..3.
..32
2332
12.1

..4.
..32
2332
1221

..3.
..32
2332
1.21

..4.
..32
2332
.221
'''
[[frostmite.art.seq]]
state = "air"
mode = "once"
fps = 12.0
frames = '''
....
..33
2332
.12.

.4.4
.433
2332
....
'''

# --- Thornhopper ------------------------------------------------------------
# A hopper for the wet biomes, and the counterweight to the slime: same brain,
# but it fires spores instead of closing, so the danger is standing still in the
# open rather than letting it touch you. Its own spore does not hurt it
# (immune poison), which is the joke and also the reason two of them in one
# clearing is survivable.
[thornhopper]
name = "Thornhopper"
brain = "hopper"
maxHealth = 18.0
contactDamage = 7.0
bodyCellsW = 6
bodyCellsH = 4
speed = 170.0
jumpSpeed = 600.0
aggroPx = 150.0
aggroYPx = 80.0
beat = 1.3
immune = ["poison"]
blood = "#7a4f9a"
ranged.projectile = "spore"
ranged.cooldown = 1.9
ranged.range = 165.0
ranged.damage = 6.0
xp = 7
value = 3
drops = [{ item = "spore_sac", count = [1, 2], chance = 0.7 }]
bands = ["surface", "shallow"]
biomes = ["jungle", "swamp"]
packSize = [1, 2]
weight = 14.0
# The spore sac is still the top-centre of the sprite and still the only thing
# that ever changes colour: 4 over the added 6 at rest, 5 over 4 charged — so
# the pale no longer just appears on the interrupt, it CLIMBS the bulb. That
# added tone is a spore green dark enough to shade the sac's underside; four
# texels of flat 4 is a green square, not a sac. It is the only new entry here,
# because tone 2 was already in the palette and had never once been drawn, and
# it is exactly the purple the body wanted under the lit 3. Legs are one texel
# wide now instead of two, which is the whole reason to draw finer; which of
# them is folded (1) and which is extended (body colour) is unchanged. It does
# not glow, so 5 is a pale tone and not a light.
#
# `move` is still a three-frame shuffle rather than a phase cycle because a
# hopper on the ground is not walking, it is waiting; the middle frame drops the
# top row and squashes the sac flat, which is the same crouch the three-pixel
# version drew by emptying row 0. The real locomotion is the `air` pose, which
# tucks to the centre column at launch and SPREADS at the apex and holds there
# for the whole arc.
art.cellsW = 6
art.cellsH = 4
art.grain = 1
art.pal = [".", "#2a1b38", "#3a2a4a", "#7a4f9a", "#c8ff7a", "#e8ffb4", "#8ac24a"]
art.fps = 7.0
[[thornhopper.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 2.8
blinkFor = 0.22
frames = '''
..44..
..66..
133331
122221

..44..
..66..
133333
122222

..55..
..44..
133331
122221
'''
[[thornhopper.art.seq]]
state = "move"
mode = "loop"
frames = '''
..44..
..66..
133331
122221

......
..44..
333331
222221

..44..
..66..
133333
122222
'''
[[thornhopper.art.seq]]
state = "air"
mode = "once"
fps = 10.0
frames = '''
..44..
..66..
..33..
..22..

44..44
33..33
333333
.2222.
'''
