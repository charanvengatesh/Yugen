# Bone is the one creature drop that is a RAW MATERIAL rather than a trophy or a
# reagent: it is an arrow shaft. That is deliberate, and it is why the skeleton
# packs in content/mobs/cavern.mob are worth fighting rather than avoiding —
# the thing shooting at you in the dark is also the thing restocking your quiver.
[bone]
name = "Bone"
category = "material"
color = [226, 220, 200]
icon = "icon_bone"
stack = 99
value = 4
desc = "Dry, light, and straighter than any branch you will find down here."
tags = ["ammo"]

# Salvage off the two automata (sentinel, bladeframe). It is not a trophy: it
# smelts, and the recipe for that lives on the product in
# content/items/resources.item — an iron bar from two scrap and a coal, which is
# what turns a bladeframe from a wall into a shortcut past an iron seam you have
# not found yet.
[machine_scrap]
name = "Machine Scrap"
category = "material"
color = [124, 132, 146]
icon = "icon_scrap"
stack = 99
value = 18
desc = "Plate, linkage and a spring that is still under tension."
tags = ["bar"]

