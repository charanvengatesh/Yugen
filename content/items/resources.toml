# Resources — what the ground gives you.
#
# Every id a `drop` line in content/blocks/*.block already names lives here, plus
# the four "the block itself, in your hand" items (dirt, sand, wood, ice) that
# blocks with no explicit `drop` fall back to via the block -> item reverse index
# in src/items/registry.ts. That fallback is why these carry `places`: digging
# dirt has to give you something you can put back, or the loop is a shredder.
#
# Colours deliberately match the block colours in content/blocks/, so a hotbar
# swatch reads as "the thing you are about to place".

# --- Diggable ground, round-trippable -------------------------------------

[stone_chunk]
name = "Stone Chunk"
category = "placeable"
color = [96, 92, 84]
icon = "icon_stone_chunk"
places = "stone"
stack = 99
value = 1
desc = "Grey, heavy, and everywhere. The floor of every plan."
tags = ["stone", "buildable"]

[dirt_clod]
name = "Dirt Clod"
category = "placeable"
color = [120, 82, 48]
