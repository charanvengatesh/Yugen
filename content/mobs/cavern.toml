.3333.
..33..
..11..

......
22..22
.2332.
..11..

......
443344
..33..
..11..

......
22..22
.2332.
..11..
'''
[[cinder_moth.art.seq]]
state = "air"
mode = "hold"
frames = '''
......
443344
..33..
..11..
'''


# --- Skeleton ---------------------------------------------------------------
# NEW, and overdue: the README's whole first sentence about combat is "Defeat
# army of skeletons", and there were none. Deliberately built as a DARK MIRROR
# OF THE PLAYER — same 2x3 body, same head/torso/legs rows, same four-frame run
# cadence — because that is what makes an army of them read as an army rather
# than as another cave animal. It is a traveler that did not get back out.
#
# Packs of two to four, each individually weaker than a stoneback, is the
# difference between the two encounters: the stoneback asks whether your pick is
# good enough, the skeletons ask whether you picked the right corridor.
#
# `stone` is the projectile because the enum is closed (MobSystem.ts owns what a
# projectile does), and of the four available it is the only one that can be
# read as a thrown bone. Immune to poison for the obvious reason.
[skeleton]
name = "Skeleton"
brain = "walker"
maxHealth = 24.0
contactDamage = 11.0
attackCooldown = 0.9
armor = 1.0
immune = ["poison"]
bodyCellsW = 2
bodyCellsH = 3
speed = 120.0
chaseSpeed = 210.0
jumpSpeed = 500.0
aggroPx = 200.0
aggroYPx = 90.0
beat = 2.0
blood = "#e4dcc4"
ranged.projectile = "stone"
ranged.cooldown = 2.1
ranged.range = 200.0
ranged.damage = 8.0
xp = 10
value = 5
# Bone is an arrow shaft (content/items/creatures.item), so the thing shooting
# at you in the dark is also what restocks your quiver. The stray arrows are the
# ones it did not get to throw.
drops = [
    { item = "bone", count = [1, 3] },
    { item = "arrow", count = [1, 3], chance = 0.3 },
]
bands = ["cavern", "deep"]
packSize = [2, 4]
weight = 15.0
# Still the DARK MIRROR OF THE PLAYER: same 2x3 body, same head/torso/legs
# thirds, same four-frame run with contacts on the first and third. `grain = 2`
# does not change that reading, it just makes each third a real feature — a
# cranium with a brow, a ribcage that tapers to the pelvis, and two legs that
# actually swing instead of one leg cell sliding side to side. The near leg is
# drawn in bone (2) and the far one in shadow (1), which is what tells the two
# contacts apart at four texels wide and gives the walk a direction.
# ONE tone appended, index 5: a near-black bone shadow for the eye sockets. The
# old darkest tone (1) is the leg/shadow bone and reads as grey against the
# skull, so a socket drawn in it was a smudge; 5 makes the skull a skull, and it
# is what the red interrupt below now swaps out of. It is used for nothing else.
art.cellsW = 2
art.cellsH = 3
art.grain = 2
art.pal = [".", "#6e6a5c", "#b8b098", "#e4dcc4", "#ff5a4a", "#3a382f"]
art.fps = 8.0
# The eye kindling red is the interrupt, and it is the same event as the
# sentinel's optic: on the two creatures in the game that shoot at you, the
# ambient tell means "it has seen you". At this grain it is two sockets going
# red rather than a whole skull, which is a smaller change on screen and a much
# louder one to read.
[[skeleton.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 2.9
blinkFor = 0.14
frames = '''
.333
.535
2222
1221
1..2
1..2

.333
.535
2222
1111
1..2
1..2

.333
.434
2222
1221
1..2
1..2
'''
[[skeleton.art.seq]]
state = "move"
mode = "phase"
frames = '''
.333
.535
2222
1221
1..2
1..2

.333
.535
2222
1221
.1.2
...2

.333
.535
2222
1221
2..1
2..1

.333
.535
2222
1221
.2.1
...1
'''
[[skeleton.art.seq]]
state = "air"
mode = "once"
fps = 10.0
frames = '''
.333
.535
2222
1221
...2
...2

.333
.535
2233
1233
.12.
....
'''


# --- Glimmerback ------------------------------------------------------------
# NEW. The Geode Hollows creature. That layer is the one with `veinRich` and
# `veinCommon` both set to crystal and a caveScale of 0.85 — tight, glittering,
# and the richest thing in the game to mine — and until now it had nobody living
# in it, so the reward was free.
#
# It is built as a TOLL rather than as a threat: armour 6 and immunity to impact
# mean punching it is pointless and even a copper pick's owner is trading a real
# amount of time, but it is slow (90), short-sighted (120px) and cannot jump, so
# it can simply be walked around. The choice it poses is "is this seam worth the
# fight", which is the only interesting question a guard can ask.
[glimmerback]
name = "Glimmerback"
brain = "walker"
maxHealth = 34.0
contactDamage = 12.0
attackCooldown = 1.1
armor = 6.0
immune = ["ice", "impact"]
bodyCellsW = 3
bodyCellsH = 2
speed = 90.0
chaseSpeed = 140.0
aggroPx = 120.0
aggroYPx = 50.0
beat = 2.8
glow = 0.4
blood = "#b48aff"
xp = 20
value = 14
drops = [
    { item = "crystal_shard", count = [2, 4] },
    { item = "gem", count = 1, chance = 0.3 },
]
bands = ["cavern", "deep"]
minDepth = 120
weight = 8.0
# Crystal on top, animal underneath. The spine is still the only part that
# changes in the idle and the feet are the only part that changes in the walk,
# so the two poses never compete — and `glow 0.4` means the spine survives the
# darkness mask, which is what makes one of these visible across an unlit geode
# chamber. `grain = 2` is what turns that spine from a lit cell into a growth: a
# jagged two-row cluster over the shoulders, bare over the head, that dulls to
# body tone (3) on the breath and then floods the whole crown with a white core
# (5) on the interrupt. Because the glow pass redraws the same tile additively,
# widening the flare rather than brightening one pixel is the cheap way to make
# it carry. The walk also gets a real gait out of the extra columns: the loaded
# foot goes to deep violet (1) and TRAVELS, instead of one body cell darkening.
art.cellsW = 3
art.cellsH = 2
art.grain = 2
art.pal = [".", "#2e2450", "#5a4a92", "#a888e8", "#e8d8ff", "#ffffff"]
art.fps = 5.0
[[glimmerback.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 3.8
blinkFor = 0.16
frames = '''
.4.4..
.44433
333333
.2..2.

.3.3..
.33333
333333
.2..2.

445544
445533
333333
.2..2.
'''
[[glimmerback.art.seq]]
state = "move"
mode = "phase"
frames = '''
.4.4..
.44433
333333
1...2.

