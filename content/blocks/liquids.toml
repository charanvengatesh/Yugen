# Liquids. `density` orders buoyancy (oil floats on water, water floats on lava)
# and `liquidSpread` is the horizontal reach per tick, which is what makes water
# level out fast and lava crawl. None of them collide, and none are dig targets,
# hence the Infinity hardness.

[water]
name = "Water"
state = "liquid"
color = [35, 82, 143]
colorVar = 16
edge = 55
density = 1.0
liquidSpread = 5
hardness = inf
tags = ["liquid"]
heat.conduct = 56
heat.cool = 3
heat.meltAt = 40
heat.meltInto = "steam"

[lava]
name = "Lava"
state = "liquid"
color = [235, 110, 35]
colorVar = 22
texture = "molten"
shimmer = 220
edge = 44
emissive = 1.0
density = 3.0
liquidSpread = 2
viscosity = 0.65
damage = 220.0
lightEmit = 13
hardness = inf
tags = ["liquid", "hazard"]
heat.emit = 255
heat.conduct = 56
heat.cool = 0

[oil]
name = "Oil"
state = "liquid"
color = [25, 22, 18]
colorVar = 14
edge = 40
density = 0.8
liquidSpread = 4
viscosity = 0.35
hardness = inf
tags = ["liquid", "hazard"]
flammable.igniteChance = 0.3
flammable.burnTime = 40
flammable.burnsInto = "smoke"
heat.conduct = 24
heat.igniteAt = 30

[acid]
name = "Acid"
state = "liquid"
color = [79, 148, 34]
colorVar = 16
edge = 60
density = 0.9
liquidSpread = 4
viscosity = 0.15
damage = 60.0
hardness = inf
tags = ["liquid", "hazard"]
heat.conduct = 46
heat.cool = 2

# Tar: the viscosity system's extreme case, and the deep world's burnable
# hazard. Skips six moves in seven and spreads one cell at a time, so a tar
# fall is a slow black rope and a tar pool barely levels; denser than water, so
# it sinks through a pool and coats the floor of it. Long-burning when lit —
# the fire keeps the wake alive, per `update_fire` — which is what makes a tar
# seam a decision rather than scenery: light it and the gallery burns for a
# long time.
# ramp: earth.0-adjacent, near-black with a warm cast so it reads against oil
# (which is browner and floats where this sinks).
[tar]
name = "Tar"
state = "liquid"
color = [18, 14, 11]
colorVar = 12
texture = "flat"
edge = 45
density = 1.2
liquidSpread = 2
viscosity = 0.85
hardness = 0.4
blastResist = 0.4
tags = ["liquid", "diggable"]
flammable.igniteChance = 0.10
flammable.burnTime = 220
flammable.burnsInto = "smoke"
heat.conduct = 25
heat.igniteAt = 90
drop = [{ item = "tar_glob", count = 1 }]
