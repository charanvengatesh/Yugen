'''

# --- hurt -------------------------------------------------------------------
# Four things change at once, which is right for the state you most need to read
# instantly. The ember blows red and takes the mane with it, so the red is now a
# fifteen-texel mass — a torn diagonal ripped up and back through all four
# overhang rows with the whole head burning at the bottom of it — instead of one
# recoloured dot. The body tones reverse. The arm flies out behind through cols
# 0-1. The leading foot leaves the floor entirely and hangs beside its own knee.
#
# It is the only frame in the file that puts a colour nothing else uses into
# row 0, so it is unmistakable even in one held frame at the edge of vision.
