# Bone is the one creature drop that is a RAW MATERIAL rather than a trophy or a
# reagent: it is an arrow shaft. That is deliberate, and it is why the skeleton
# packs in content/mobs/cavern.mob are worth fighting rather than avoiding —
# the thing shooting at you in the dark is also the thing restocking your quiver.
[bone]
name = "Bone"
category = "material"
color = [226, 220, 200]
icon = "icon_bone"
stack = 99
value = 4
desc = "Dry, light, and straighter than any branch you will find down here."
