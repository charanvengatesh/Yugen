# Level gadgets: solids whose whole point is the `surface` tag they carry, read
# by the player's contact code. They are authored into levels (levelData.ts) by
# code, so their ids and codes are load-bearing.

[spike]
name = "Spike"
state = "solid"
color = [210, 70, 70]
colorVar = 12
texture = "crystalline"
edge = 205
damage = 30.0
hardness = 1.0
blastResist = 0.5
tags = ["hazard", "diggable"]
heat.conduct = 56

[bounce]
name = "Bounce"
state = "solid"
color = [80, 220, 120]
colorVar = 14
texture = "glassy"
edge = 145
surface = "bounce"
hardness = 1.0
tags = ["buildable"]

[conveyorRight]
name = "Conveyor →"
state = "solid"
color = [200, 160, 60]
colorVar = 12
texture = "layered"
edge = 145
surface = "conveyorR"
hardness = 1.0
tags = ["buildable"]

[conveyorLeft]
name = "Conveyor ←"
state = "solid"
color = [200, 160, 60]
colorVar = 12
texture = "layered"
edge = 145
surface = "conveyorL"
hardness = 1.0
tags = ["buildable"]

# Displayed as "Sticky Mud", not "Mud" — the ecotone set adds a real `mud`
# terrain block. This one is the gadget: same brown family, but it grips the
# player (surface sticky). Only the display string differs; the id and code are
# load-bearing (levelData, the ASH+WATER reaction) and stay put.
[sticky]
name = "Sticky Mud"
state = "solid"
color = [74, 53, 32]
colorVar = 16
texture = "grain"
edge = 56
surface = "sticky"
hardness = 0.8
tags = ["soil", "diggable"]
heat.conduct = 34
heat.cool = 2
heat.meltAt = 55
heat.meltInto = "dirt"
