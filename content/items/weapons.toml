# Swords — straight out of the README's fiction.
#
# "Traveler Sword: Basic sword, that doesn't do much damage."
# "Kings sword: every hit takes away a heart."
#
# The player has MAX_HEALTH 100 across the README's four hearts, so a heart is
# 25 hp and the King's Sword deals exactly that. The Traveler Sword deals 8 —
# three and a bit swings per heart — and swings nearly twice as fast, so the two
# are not simply better and worse: 23.5 dps against 40.3 dps, bought with a
# 0.62s commitment per swing and a knockback that will shove a target off a ledge
# you were standing on.

[sword_traveler]
name = "Traveler Sword"
category = "weapon"
color = [168, 172, 180]
icon = "icon_sword_traveler"
stack = 1
tier = 0
value = 40
desc = "Light, quick, and honest about what it is."
tags = ["sword"]
weapon.damage = 8.0
weapon.knockback = 90.0
weapon.swingTime = 0.34
craft = [{ in = ["copper_bar", "wood_log"], n = [2, 1], out = 1, station = "workbench" }]

[sword_king]
name = "King's Sword"
category = "weapon"
color = [226, 198, 104]
icon = "icon_sword_king"
stack = 1
tier = 4
value = 2400
desc = "Every hit takes a heart. Slow enough that you have to mean it."
tags = ["sword", "gem", "relic"]
weapon.damage = 25.0
weapon.knockback = 240.0
weapon.swingTime = 0.62
craft = [{ in = ["gold_bar", "iron_bar", "gem"], n = [3, 2, 3], out = 1, station = "anvil" }]

# --- Ranged -----------------------------------------------------------------
#
# THE CONTRACT, because two systems have to agree on it. A ranged weapon is the
# ordinary `weapon` group with `ranged true`; it carries `projectileSpeed` (world
# px/s, authored in the player's frame where MAX_RUN_SPEED is 360) and an `ammo`
# LIST of the items it can be loaded with, in preference order. The runtime
# spends the first entry the player is actually holding, and that list is also
# the whole acceptance test — a launcher fires what it names and nothing else.
#
# It is a list rather than an `arrow_iron|arrow` preference chain on purpose: a
# `ref?` chain is resolved by the COMPILER (FORMAT.md §2 — "picks the first id
# that exists"), so it would collapse to one string in the generated module and
# the bow would silently refuse flint arrows forever. Runtime choice needs a
# runtime list.
#
# Damage is ADDITIVE:
#
#     shot damage = launcher weapon.damage + ammo weapon.damage
#
# with the second term 0 when the ammo declares no weapon group at all. That is
# what lets ONE bow span flint and iron arrows instead of shipping two bows, and
# it is why the sling can take a plain `stone_chunk` — a material with no weapon
# group is legal ammo that simply adds nothing.
#
# TUNED AGAINST THE SWORDS, which are the only DPS numbers already in content:
# traveler 8/0.34 = 23.5 dps, king 25/0.62 = 40.3 dps.
#
#   sling + stone_chunk    5 + 0  / 0.75 =  6.7 dps   free ammo, tier 0
#   bow   + arrow          6 + 4  / 0.55 = 18.2 dps   under the traveler sword
#   bow   + arrow_iron     6 + 9  / 0.55 = 27.3 dps   over it, under the king
#
# Every rung sits BELOW the melee weapon of its own tier, on purpose. Range is
# already the reward; a bow that also out-damaged a sword would end melee.

[sling]
name = "Sling"
category = "weapon"
color = [150, 122, 92]
icon = "icon_sling"
stack = 1
tier = 0
value = 25
desc = "A pouch and two cords. Ammunition is whatever the floor is made of."
tags = ["bow"]
weapon.damage = 5.0
weapon.knockback = 40.0
weapon.swingTime = 0.75
weapon.ranged = true
weapon.projectileSpeed = 380.0
# Deliberately `stone_chunk` rather than a bespoke pellet: the point of the
# sling is that it is the ranged weapon you can always feed, in a game where
# stone is the floor of every plan.
weapon.ammo = ["stone_chunk"]
craft = [{ in = ["hide", "vine_coil"], n = [2, 1], out = 1, station = "hand" }]

[bow]
name = "Bow"
category = "weapon"
color = [176, 132, 72]
icon = "icon_bow"
stack = 1
tier = 1
value = 140
desc = "Draw, hold, and let the distance do the work."
tags = ["bow", "wood"]
weapon.damage = 6.0
weapon.knockback = 70.0
weapon.swingTime = 0.55
weapon.ranged = true
weapon.projectileSpeed = 560.0
# A LIST, best first — not a `|` chain. A chain asks "which of these exists?"
# and collapses to one winner at compile time; ammo is the other question,
# "which of these do you actually have", which can only be answered at the
# moment of firing. So a quiver of iron arrows is spent before the flint ones
# without the player having to swap anything.
weapon.ammo = ["arrow_iron", "arrow"]
craft = [{ in = ["wood_log", "rope"], n = [3, 2], out = 1, station = "workbench" }]

# --- Ammunition -------------------------------------------------------------
# `material`, not `weapon`: you never hold an arrow as your active tool. The
# weapon group on these is data the launcher reads, which is exactly what the
# additive contract above is for.

[arrow]
name = "Arrow"
category = "material"
color = [198, 178, 140]
icon = "icon_arrow"
stack = 99
tier = 0
value = 1
desc = "A shaft, a flint head, and no illusions about either."
tags = ["ammo"]
weapon.damage = 4.0
# Eight per craft, at hand, from two things the surface hands you. Ammunition
# that has to be rationed turns a ranged weapon into a melee weapon you are bad
# at, so the flint tier is priced to be spent freely.
craft = [
    { in = ["wood_log", "flint"], n = [1, 1], out = 8, station = "hand" },
# Bone is the cave route, for the run where you have gone down further than you
# have gone out. Skeletons drop it, so the thing shooting at you resupplies you.
    { in = ["bone", "flint"], n = [1, 1], out = 6, station = "hand" },
]

[arrow_iron]
name = "Iron Arrow"
category = "material"
color = [186, 186, 190]
icon = "icon_arrow_iron"
stack = 99
tier = 2
value = 6
desc = "Heavy enough that the wind stops having an opinion."
tags = ["ammo"]
weapon.damage = 9.0
craft = [{ in = ["wood_log", "iron_bar"], n = [2, 1], out = 8, station = "anvil" }]
