# A style study, extracted from a reference sheet — NOT game content.
#
# ---- WHY THIS IS NOT UNDER content/ ----------------------------------------
# `content/ids.lock.json` never reuses a code. A record that lands in content/
# spends one permanently, so fifty-four of them is a permanent commitment made
# for art that nothing in the game draws. This tree is a second content ROOT
# instead: the editor takes one as an argument, so these open and edit exactly
# like the real thing, and `contentc` never sees them.
#
#     cargo run -p yugen-editor -- reference
#
# Promoting one is a copy-paste into a file `content/LAYOUT.toml` claims, at
# which point it earns its code honestly.
#
# ---- PROVENANCE ------------------------------------------------------------
# These are traced from a third-party sprite sheet the author had on disk as
# reference. Their licence has NOT been established. They are here to be read
# and measured, and anything shipped should be drawn rather than copied.
#
# ---- WHAT THE EXTRACTION DID ----------------------------------------------
# The source characters are 5x5 to 8x8 inside their own bounding boxes. Each is
# padded to 8x8 FEET-ANCHORED AND HORIZONTALLY CENTRED, which is the anchor both
# render hosts already use and the one `procgen::resize` defaults to — so these
# sit on the ground the same way every creature in the bestiary does.
#
# Palettes are ordered DARKEST TO LIGHTEST, so index 1 is the ink and the high
# indices are the highlights, matching how the rest of the tree is authored.
#
# ---- THEY MOVE ------------------------------------------------------------
# The sheet is static; these are not. Each character carries two derived poses:
#
#   idle   `anim::bob`  — the drawing, and the drawing lifted one texel
#   run    `anim::walk` — a four-beat cycle alternating which foot is down
#
# Neither was drawn. Both are functions of the still frame, which is the point:
# a generator that can make a static 8x8 move is worth more than 54 more static
# 8x8s. 29 of these have two separate groups of texels on the bottom row and get
# a real alternating step; 22 have one solid base and get a hop, which is the
# honest reading of a creature with no legs; 3 have three groups and alternate
# odd against even.
#
# Five characters carried ten to twelve colours, and a frame character is one
# digit, so nine is the ceiling. Those five were quantised: the rarest colours
# were merged into their nearest surviving neighbour by RGB distance. The other
# forty-nine are exact.

