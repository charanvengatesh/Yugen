# The player. No longer transcribed from src/entities/PlayerSprite.ts — this is
# the first version of the character that the TypeScript original never had, and
# the ARCHITECTURE-ts-reference.md drawing is now history rather than the target.
# What did not change is who owns it: the twelve states the movement code can
# produce and the twelve sequences that exist here are still the same list by
# construction, generated from this file, so `AnimState` cannot drift from the
# sequence table sitting below it.
#
# ---- ONE ART PIXEL WAS ONE WORLD CELL --------------------------------------
# `grain = 2` now, so it is one HALF of one, in both axes. Nothing about the
# SIZE moved: cellsW is still 4, cellsH is still 5, the drawn rect is still
# 20x25px at CELL_SIZE 5. Each cell is simply authored as a 2x2 block, so every
# frame below is TEN ROWS OF EIGHT CHARACTERS where it used to be five of four,
# and the compiler rejects a frame that is anything else.
#
# THE FLEET WENT FIRST, AND THE PLAYER FOLLOWS. The frostmite was the one
# experiment: drawn at grain 2 and stood next to a grubling so the question
# "does finer art read as pasted onto a chunkier world, or does it just read
# better?" could be answered by looking. It read better. The other nineteen
# creatures followed. The player is the twenty-first drawing to move, and it
# moves for the same reason — a figure twenty world pixels wide is small and
# dense enough to spend the resolution on shape instead of on noise.
#
# TERRAIN DOES NOT FOLLOW AND IS NOT GOING TO. A cell is the unit the simulation
# actually thinks in: it is what you dig, what floods, what you stand on. Draw
# rock finer than it is simulated and the world starts lying about where a
# pickaxe lands. A sprite is never the thing you interact with — the hitbox is,
# and the hitbox is still counted in whole cells — so a sprite is allowed to be
# finer than the ground it stands on. That asymmetry is the entire content of
# `grain`, and the schema doc on it is what stops the field drifting further.
#
# What is still NOT on the table is the 16x16 grid the art came from. That
# sprite pixel was 1.25 x 1.5 world px — four times finer than the sim cell and
# not even square — so the character read as a smooth hi-res figure pasted onto
# a chunky cellular world. Grain 2 lands on a half cell in both axes, stays
# square, and stays aligned to the grid it is standing on. It is a finer grid;
# it is not a different one.
#
# ---- THE COLLISION BOX DID NOT MOVE ----------------------------------------
# The box is still 2x3 CELLS (10x15px). The engine derives the surplus from
# cells, not from texels, so the pads are the same numbers they always were:
#
#   pad_x   = (4 - 2) / 2 * CELL_SIZE =  5px each side
#   pad_top = (5 - 3)     * CELL_SIZE = 10px above
#
# so the FEET stay on the bottom row and everything extra grows up and sideways.
# The map below is the old one with every index doubled — that is the whole of
# what `grain` does to it:
#
#   rows 4-9  x  cols 2-5   THE HITBOX. Head, torso, feet. What gets hit.
#   rows 0-3                overhang above the head — mane, a thrown fist.
#   cols 0-1, cols 6-7      overhang either side — arms, a swung leg, a trail.
#
# An EVEN `cellsW` is a choice here, not a requirement, and it is worth knowing
# which. `ArtGrid::from_def` computes `pad_x` in f32 and a half-cell origin is
# explicitly legal for the player — `player_art.rs` says so and
# `an_odd_horizontal_surplus_lands_the_origin_on_a_half_cell` pins it — because
# forcing a whole cell would push the figure visibly off centre instead. (Mobs
# are the opposite: `mobs::defs` PANICS on an odd surplus. Do not carry that rule
# across.) 4 is used because two symmetric overhang columns give the arms
# somewhere to go, not because 3 was forbidden.
#
# ---- WHAT EIGHTY TEXELS BUY THAT TWENTY COULD NOT --------------------------
# Twenty pixels bought the silhouette: arms, a mane, a far side, a real squash.
# Every one of those is still here and still means the same thing. The list below
# is what the extra sixty bought ON TOP of it, and it is deliberately short,
# because a fourfold grid is four times as easy to fill with noise.
#
#   SHADING, NOT SUBSTITUTION. A limb used to change colour to change depth.
#               Now the head carries a lit crown over an amber underside, the
#               torso is lit in front and shaded behind IN THE SAME FRAME, and
#               tone 7 is free to mean "behind the body" instead of "smaller".
#   LEGS, NOT A FOOT ROW. Two one-texel legs with a gap between them read as a
#               stride at any speed. `run` plants a foot six texels from its
#               partner; at grain 1 the widest stance the grid could hold was
#               two, and both contacts had to be the same width.
#   A HALF-CELL BOB. run's high pass lifts the whole figure one texel and its
#               low pass does not. That vertical bounce did not exist before:
#               the smallest lift the old grid could draw was a full cell, and a
#               full cell on a five-cell figure is a hop, not a run.
#   ROUNDED MASS. `doubleJump` curls into an actual ball with the corners taken
#               off it and the head orbiting outside as a block; `land` puffs
#               dust out of both bottom corners while the ember is crushed flat.
#
# ---- THE TWO SPENT ROWS WERE EVENTUALLY TAKEN ------------------------------
# This record was 8x10 and is now 8x8, because every drawing in the game is 8x8:
# the icons always were, the creatures were padded to it, and the player was the
# one record that had to give something up for the rule.
#
# What it gave up was real. Twenty-three of the thirty-two frames never touched
# rows 0 and 1 — the paragraph that used to sit here argued at length that those
# rows were spent rather than owned, and it was right — but NINE frames did, and
# a crop takes them from all thirty-two. Those nine were the seven that carry the
# ears, plus jump's launch trail and hurt's impact streak.
#
# So the head was redrawn rather than cropped. The ears keep their row; the jaw
# and the neck, which were two rows saying nearly the same thing, became one.
# That is the only structural change to the figure, and it is why the drawing
# below still reads as the same character on a canvas two rows shorter. Jump and
# hurt simply lost the tips of a trail and a streak that both still enter from
# off-frame, which is what a trail and a streak are for.
#
# What the crop bought back is the reason to do it: at 8x8 a quarter turn is
# defined, a frame can be pasted from any record into any other, and a generator
# with a fixed footprint fits everything. None of those are true on a grid that
# is 8x8 for eighty-seven records and 8x10 for one.
#
# The figure is now 1.33x the body's height where it was 1.67x. The BOX DID NOT
# MOVE — `player_art.rs` asserts exactly that, and it is the half of this change
# that had to be free.
#
# Authored facing RIGHT; left is a horizontal flip at draw time. Transparency
# still does most of the acting: dropping the bottom row lifts the figure off
# the ground, dropping cols 6-7 flattens it against a wall, and pushing
# everything down squashes it on impact.
#
# ---- SHARED POSES ARE REPEATED, NOT NAMED ----------------------------------
# Several states legitimately land on the same drawing — run's low passing beat
# is the idle exhale, and so is land's and punch's recovery; doubleJump recovers
# onto run's far-foot contact, byte for byte. Those frames are written out again
# here rather than hoisted into a named intermediate: the runtime's bake cache is
# keyed on the frame text, and ten rows of eight characters is still just text,
# so identical frames still share ONE baked canvas and the file stays readable as
# a filmstrip instead of as a symbol table. Four frames below are the same nine
# lines; if you edit one of them you are editing four states.

[player]
name = "Player"

# BODY_SCALE. These were 4x5 at grain 2 — the same characters, each one a 2x2
# block of cells. Dropping the grain to 1 and doubling the cell box spread the
# IDENTICAL art over twice the cells per axis, which was exactly the 2x the body
# wanted and cost no re-authoring. The height came back down to 8 later, and
# that one did cost a redraw — see the note above.
cellsW = 8
cellsH = 8

# One character per cell. Every frame in this file is eight rows of eight, the
# same grid every other drawing in the game is on, and nothing else compiles.
grain = 1

# Eighty texels are enough for shading but not for decoration, so every colour
# still has a job. Teal body + gold head is the identity and did not move — it is
# the loudest thing against dark grey-blue rock, brown earth and white snow, and
# an ember survives being four texels where a face never could.
#
# Two exist to make the overhang legible rather than to make the character
# prettier:
#
#   7 is the FAR SIDE. Anything reaching into cols 0-1 or 6-7 that is behind the
#     torso is drawn in it. It is one step below the body shade, dark enough to
#     sit back but still obviously the same material, so a splayed arm reads as
#     depth instead of as extra body — which is what keeps the drawing honest
#     about where the hitbox ends.
#   8 is the MANE, one step cooler than the ember — and, at this grain, the
#     ember's own UNDERSIDE. Drawn in 4 the crest competed with the head for the
#     brightest pixel and the face stopped being the focal point; drawn in a body
#     tone it read as a helmet. An amber says "this is the same flame, further
#     from the source", which is exactly as true of the jaw under a lit crown as
#     it is of the trailing crest — so the head gets a shaded underside without a
#     tenth entry. Nine is the format's ceiling and this file is sitting on it.
#
#   0 .        transparent            5 #ff6b57  ember blown red — hurt only
#   1 #1b1220  ink, planted feet      6 #fff3c4  spark — dash trail, punch
#   2 #3ec8b4  body lit (leading)                impact, swim bubble, skid
#   3 #21877e  body shade (trailing)             scrape, landing dust
#   4 #ffcf5c  ember head — the       7 #14564f  body deep — far-side limbs
#              bloom pass takes it    8 #e8913a  mane; ember underside
pal = [".", "#19242e", "#e7b471", "#21877e", "#ffcf5c", "#b46a27", "#cda35b", "#14564f", "#e8913a", "#ffffff"]

variants = 1

# Every sequence below sets its own rate, so the sprite-wide `fps` is never
# consulted; it is left at the schema default rather than authored to a lie.

# --- idle -------------------------------------------------------------------
# Ambient, not a loop: a slow breath with an occasional blink on top. The first
# two frames alternate at `fps` — exhale (chest shaded behind, lit in front,
# mane hanging straight down behind the head) and inhale (the whole chest lifts
# onto the lit tone and the mane leans back one texel). One texel of lean is a
# drift the old grid had to spend a whole cell on; here it is the smallest motion
# in the file, which is the right size for a breath.
#
# The trailing arm hangs in col 1 on both frames — three texels of tone 7 from
# shoulder to hand — and it is the ONLY overhang the resting figure spends. Cols
# 0, 6 and 7 stay empty so the standing silhouette never claims to be wider than
# the box plus one arm.
#
# The LAST frame is the interrupt, held for blinkFor every blinkEvery. The whole
# flame guttering IS the blink — head AND mane drop to body shade, eleven texels
# going dark at once where the old grid could only dim three. There is still no
# eye to close, and now there does not need to be.
#
# fps is written as the reciprocal of the authored beat, 1/0.62, and the exact
# double for it rather than a rounded 1.613. The runtime computes
# `beat = 1/fps` and then `floor(t / beat)`, and 1/(1/0.62) === 0.62 exactly in
# IEEE754, so the reciprocal round-trips bit-for-bit to the original
# IDLE_BREATH constant. 1.613 does not: it disagrees with the old
# PlayerSprite.idleFrame() on 91 of 600,000 samples over 60s.
[[player.seq]]
state = "idle"
mode = "ambient"
fps = 1.6129032258064517
blinkEvery = 4.6
blinkFor = 0.1
frames = '''
..1.1...
.111621.
1116222.
.166222.
.35878..
.277332.
..5588..
..7..7..
'''

# --- run --------------------------------------------------------------------
# Indexed by the run phase the Player advances from real horizontal speed, so
# contacts land on phase 0.0 and 0.5 — frames 0 and 2 — which is where the
# footstep particles are emitted. Both contacts show a real stride, because a
# foot is allowed to leave the hitbox columns and now has room to land when it
# gets there:
#
#   frame 0  NEAR-foot contact. The near foot plants forward in cols 6-7 (ink),
#            the far foot trails back into cols 1-2 in tone 7, and the far arm
#            swings back and down through cols 0-1. Six texels of stride, and
#            contralateral, which is what stops a run from reading as a hop.
#   frame 2  FAR-foot contact. The limbs swap ends: near foot back in cols 0-1,
#            far foot planted forward in tone 7, near arm thrown forward across
#            cols 6-7 on the lit tone. Same cadence, opposite limbs, and the
#            depth tone is what says "other side of the body" rather than
#            "smaller step".
#
# THE TWO PASSING BEATS ARE NOT THE SAME DRAWING, and at this grain they are not
# even at the same HEIGHT. Frame 1 is the HIGH pass: the whole figure sits one
# texel — half a cell — further up the frame, the arms tuck in, the silhouette
# narrows to the four hitbox columns, the chest goes fully lit and the legs
# gather under the hips over a stretched three-texel push-off. Frame 3 is the LOW
# pass and is the idle exhale exactly, arm out and both feet down. Near-side pass
# rides high, far-side rides low, which is what a run seen from one side actually
# does — and half a cell is the amount it does it by. A full cell was a hop.
#
# The body tones are NOT swapped to lit-behind-shade on either beat: that
# reversal is reserved for `skid`, where it means the weight is going the other
# way.
[[player.seq]]
state = "run"
mode = "phase"
frames = '''
..1.1...
.111621.
1116222.
.166222.
.35878..
.277332.
..55.88.
.7....7.

..1.1...
.111621.
1116222.
.166222.
.35878..
..77332.
.25588..
...7.7..

..1.1...
.111621.
1116222.
.166222.
.35878..
.277332.
.55..88.
7......7

..1.1...
.111621.
1116222.
.166222.
.35878..
..77332.
..5588..
.7..7...
'''

# --- skid -------------------------------------------------------------------
# The body tones are SWAPPED, so the lit side trails the facing: the figure faces
# the new direction while its weight still goes the old way, which is exactly
# what a turnaround is. The mane confirms it — it blows FORWARD across the top of
# the head into cols 3-6, and the ember's amber underside goes with it, sitting
# under the FRONT of the jaw instead of the back. Hair trails the motion and the
# motion is now backwards; that one cue is worth more than the tone swap on its
# own ever was, and at this grain it is four texels of it rather than one.
#
# The far arm is flung back through cols 0-1 as a brace, the leading foot is
# planted out in cols 6-7 and the trailing leg is folded under. A pair of sparks
# scrapes off behind the leading foot on the second frame and nothing else
# changes, so the state still reads as one fixed posture — it just stops being
# the only sustained state in the set that is completely static, which at ten
# frames a second is the difference between braking and being paused.
[[player.seq]]
state = "skid"
mode = "loop"
fps = 10.0
frames = '''
...1.1..
.111621.
1116222.
.166222.
.35878..
.277332.
.55..88.
7......7

...1.1..
.111621.
1116222.
.166222.
.35878..
..77332.
55....88
.7....7.
'''

# --- jump -------------------------------------------------------------------
# Launch: the tallest frame in the file, and the only one that spends all ten
# rows on one continuous line of the body. The leading arm goes up the front
# overhang as an unbroken column of lit texels — shoulder out to col 6 at the
# chest, then straight up to the hand in row 0 — the chest is fully lit, and the
# trailing foot is already gone. Maximum extension, and it survives being this
# large because `once` at 9fps means it exists for one ninth of a second and can
# never be mistaken for the resting silhouette.
#
# Then the tuck: the arm drops back to a hanging tone 7, the mane spreads across
# four texels as the rise slows, the knees come up and the figure loses the top
# two rows.
[[player.seq]]
state = "jump"
mode = "once"
fps = 9.0
frames = '''
..8...2.
..88..2.
..44442.
..84442.
..22222.
..2222..
...22...
...1....

.8888...
..88....
..4444..
..8444..
.73322..
.73322..
...32...
...1....
'''

# --- doubleJump -------------------------------------------------------------
# The one move with a real animation, and at this grain the somersault has an
# actual body to turn. The torso curls into a four-by-four ball with the corners
# taken off it, parked inside the hitbox columns, and it does not move a texel
# across the first three frames; the HEAD orbits it as a two-by-two block, with
# the mane always one station behind like a comet's tail:
#
#   frame 0  ember on top, mane trailing off the back of it, and a spark kicked
#            out underneath — the mid-air push that paid for the jump.
#   frame 1  ember swung round to the front at torso height, mane above it in
#            the station the head has just left.
#   frame 2  fully inverted: ember below the ball, mane trailing off the front.
#   frame 3  recovered, and it is run's far-foot contact BYTE FOR BYTE, so the
#            roll lands straight into the run cycle instead of stopping first.
#
# Nothing else in the set moves the head off rows 4-5, so this cannot be confused
# with the first jump even at 12fps.
[[player.seq]]
state = "doubleJump"
mode = "once"
fps = 12.0
frames = '''
.8844...
.8844...
...22...
..2222..
..3333..
...33...
...66...
........

........
........
...22.88
..222288
..333344
...33.44
........
........

........
........
...22...
..2222..
..333388
...33.88
...44...
...44...

..8.....
..88....
..4444..
..8444..
..332222
..3322..
.1....7.
11....77
'''

# --- fall -------------------------------------------------------------------
# A dim, loose body — both torso columns on the shade tone, no lit teal anywhere
# in the core — with the limbs doing the work. Three frames on a slow loop so it
# flails rather than vibrates, and the arms are what make it flail: back arm out
# through cols 0-1 with the far leg swung forward, then BOTH arms thrown up level
# with the head crown and both feet gone, then the front arm out through cols 6-7
# with the far leg swung back. The middle frame is the one that has to drop both
# feet — the leg swings through empty air between the two contacts instead of
# teleporting from one side to the other. Two frames made the fall read as a
# metronome; the odd frame count is what makes it read as loose.
#
# The swung leg is in tone 7 at both ends, so the flail widens the far side of
# the figure and never the body.
[[player.seq]]
state = "fall"
mode = "loop"
fps = 6.0
frames = '''
.8888...
..88....
..4444..
..8444..
773333..
..3333..
...3..7.
...1..7.

..88....
.788..2.
77444422
..8444..
..3333..
..3333..
...33...
........

.8888...
..88....
..4444..
..8444..
..333322
..3333..
.7...3..
.7...1..
'''

# --- land -------------------------------------------------------------------
# Impact, and this is where the wide grid earns its keep twice over. The figure
# loses ALL FOUR overhang rows, the ember is crushed from two rows into one and
# shoved a full cell lower, the mane is forced up above it as a plume six texels
# across, the arms splay all the way into cols 0-1 and 6-7, and dust sparks out
# of both bottom corners at once. Four rows shorter and four texels wider in a
# single frame — a squash that is actually a squash, where the old grid could
# only delete a row.
#
# Three beats: squash, RISE, neutral. The rise recovers the full height but keeps
# the body on the dim shade tone it had while falling, so the figure comes back
# up before it comes back to strength. Cutting straight from the squash to the
# neutral stand made the recovery instantaneous, which threw away most of what
# the squash frame had just paid for. The last frame is the idle exhale exactly.
[[player.seq]]
state = "land"
mode = "once"
fps = 14.0
frames = '''
........
........
..8888..
.888888.
77444422
77333322
66111166
.611116.

..8.....
..88....
..4444..
..8444..
.73333..
.73333..
.73..3..
..1..1..

..8.....
..88....
..4444..
..8444..
.73322..
.73322..
.73..2..
..1..1..
'''

# --- dash -------------------------------------------------------------------
# The pose is welded: the mane blown dead flat into a two-by-two bar sitting
# level with the head, so amber and ember run together as one six-texel
# horizontal streak; chest fully lit; one toe skimming. Nothing about the FIGURE
# moves between the frames — only the sparks peeling off the back column, which
# is what makes it a streak rather than an animation.
#
# Three frames rather than two: an even count at this rate gives a 9Hz
# alternation that the eye locks onto as a flicker, where an odd one keeps
# re-landing on a different beat and stays a streak. Trail high in the upper
# overhang, trail low off the chest, then both at once — the trail briefly
# doubling is what sells speed. Each wisp is a three-texel diagonal now instead
# of a lone pixel, so it has a direction as well as a position.
[[player.seq]]
state = "dash"
mode = "loop"
fps = 18.0
frames = '''
6.......
66......
884444..
884444..
..2222..
..2222..
...22...
....1...

