# Underground. `place cavern` is offered a 2D lattice gated on the cavern band;
# `place underground` is the same lattice with a wider depth window.
#
# Every one of these carves its own interior (the `.` glyphs) before lining it,
# so it reads as a room cut out of the rock whatever the cave field happened to
# be doing at that coordinate. That is also why they must overwrite rather than
# assume: worldgen's probe is an oracle, generateChunk is the authority.

[cave_shrine]
name = "Cave Shrine"
place = "cavern"
rarity = 0.45
weight = 1.6
bands = ["shallow", "cavern"]
minDepth = 46
maxDepth = 190
anchor = "center"
mirror = true
legend = [
    { c = "S", block = "stone" },
    { c = "C", block = "crystal" },
    { c = "L", block = ["goldOre", "ironOre"], mark = "loot" },
    { c = "X", mark = "spawn" },
]
body = '''
_SSSSSSSSSSS_
_S.........S_
_S..C...C..S_
_..........S_
_S..X.C....S_
_S..SSSSS..S_
_S..S.L.S..S_
_S..SSSSS..S_
_SSSSSSSSSSS_
'''

# The fungal alternative. Same lattice, different biome of the deep, and it
# leans on the mushroom blocks so the room is lit by what grows in it.
[fungal_grotto]
name = "Fungal Grotto Shrine"
place = "cavern"
rarity = 0.4
weight = 1.0
bands = ["cavern", "deep"]
minDepth = 70
maxDepth = 260
anchor = "center"
mirror = true
legend = [
    { c = "U", block = "mud" },
    { c = "Y", block = "mushroomCap" },
    { c = "Z", block = "mushroomStem" },
    { c = "V", block = "vine", soft = true },
    { c = "L", block = ["gemOre", "goldOre"], mark = "loot" },
    { c = "X", mark = "spawn" },
]
body = '''
_UUUUUUUUUUU_
_UV.......VU_
_U.Y.....Y.U_
_U.Z..X..Z.U_
_U....Y....U_
_U....Z..L.U_
_..........U_
_UUUUUUUUUUU_
'''

# Sealed, doubled-walled, and holding two caches. No entrance at all: the outer
# ring is a corridor you can break into, the inner box you have to dig through.
[sealed_vault]
name = "Sealed Vault"
place = "underground"
rarity = 0.22
weight = 1.0
bands = ["cavern", "deep"]
minDepth = 120
maxDepth = 420
anchor = "center"
mirror = false
legend = [
    { c = "B", block = "clay" },
    { c = "K", block = "spike" },
    { c = "L", block = ["gemOre", "goldOre"], mark = "loot" },
]
body = '''
_BBBBBBBBBBBBB_
_B...........B_
_B.BBBBBBBBB.B_
_B.B.......B.B_
_B.B..L.L..B.B_
_B.B...K...B.B_
_B.BBBBBBBBB.B_
_B...........B_
_BBBBBBBBBBBBB_
'''
