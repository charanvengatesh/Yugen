# Flora: things that grow, spread, or make up a canopy.
#
# Canopy blocks. Trees previously built their canopy out of WOOD, so a forest
# read as a field of brown lollipops. All are flammable with a high colorVar so a
# canopy dithers into a mass rather than a flat slab, and all burn to smoke — a
# lightning strike or a lava flow should take a wood out. They collide: a canopy
# you can stand on is worth more than one you fall through, and it gives the
# platforming something to use.

[moss]
name = "Moss"
state = "solid"
color = [49, 68, 29]
colorVar = 20
texture = "fibrous"
edge = 56
hardness = 0.3
blastResist = 0.2
tags = ["flora", "foliage", "diggable"]
flammable.igniteChance = 0.08
flammable.burnTime = 70
flammable.burnsInto = "smoke"
heat.conduct = 22
heat.igniteAt = 40
# Creeps over bare rock/soil, but only a few cells out from any seed so the
# spread is finite and the chunk goes back to sleep.
growth.chance = 0.012
growth.onto = ["dirt", "stone", "sandstone", "basalt", "clay", "mud"]
growth.maxGen = 4

# Vines trail downward through open air; passable, and they burn well.
#
# Climbable, which is the whole reason a jungle reads differently from a plain:
# the world generates its own ladders there, and they were already `collides
# false` (see content/blocks/fixtures.block on why climbable and collidable are
# mutually exclusive), so this is one bit rather than a retune. A vine that has
# grown down a shaft is now a route, and burning one out from under yourself is
# a consequence that was always implied by `igniteChance 0.12`.
[vine]
name = "Vine"
state = "solid"
color = [44, 70, 32]
colorVar = 18
texture = "fibrous"
edge = 50
collides = false
climb = true
hardness = 0.2
blastResist = 0.2
tags = ["flora", "foliage", "diggable"]
flammable.igniteChance = 0.12
flammable.burnTime = 45
flammable.burnsInto = "smoke"
heat.conduct = 22
heat.igniteAt = 38
growth.chance = 0.04
growth.onto = ["empty"]
growth.downward = true
growth.maxGen = 12

# ---- WHY EVERY CANOPY IS ONE-WAY -------------------------------------------
# `collides = false` + `oneWay = true` on all four leaf blocks, and it is a
# movement fix, not a flora opinion. Pine branches alternate sides at
# alternating heights, which makes every tree a spiral staircase of 1-cell
# steps -- and step-up (the thing that lets a body walk over rubble) treats a
# staircase as a ramp it can take at one cell per stride. Measured before this
# change: a body walking into a pine CLIMBED it, 10 cells in 42 frames, with no
# jump pressed; walkers did the same on patrol, because `turn_on_wall` only
# fires when the mover reports BLOCKED and step-up prevents "blocked". Dense
# canopy also formed sheer 10-cell walls, which is why a quarter of seeds spawned
# the player into a pocket it could not walk out of.
#
# One-way keeps what solid foliage was buying: you can still LAND on a canopy
# and stand there, still climb a tree by jumping. What it removes is the
# sideways wall and the staircase -- a walking body passes through leaves, which
# is what leaves are.
[leaves]
name = "Leaves"
state = "solid"
color = [66, 90, 38]
colorVar = 30
texture = "fibrous"
edge = 60
density = 0.5
collides = false
oneWay = true
hardness = 0.2
blastResist = 0.2
tags = ["flora", "foliage", "diggable"]
flammable.igniteChance = 0.16
flammable.burnTime = 40
flammable.burnsInto = "smoke"
heat.conduct = 20
heat.igniteAt = 78
drop = [{ item = "sapling", count = 1, chance = 0.05 }]

