# --- punch ------------------------------------------------------------------
# Wind-up: the body dims to the shade tone, the feet set, and the fist cocks back
# into cols 0-1 on the LIT tone — the brightest thing in the frame is the thing
# that is about to move, which is the whole trick for telegraphing at 14fps. At
# this grain the cocked arm is a shape rather than a recoloured corner: upper arm
# angled through col 1, fist a two-texel block out in cols 0-1.
#
# Contact: the arm fires across the body and out into col 6, and col 7 — the
# outermost column in the frame — flashes as an unbroken four-texel spark bar,
# mane whipped back to cols 0-1 by the turn. That bar is the longest continuous
# spark in the file outside the dash trail, and it is deliberately outside the
# hitbox: the strike reaches further than the character can be hit, which is
# exactly what the overhang column is for.
#
# Recovery is the idle exhale exactly. The feet never move across all three
# frames.
[[player.seq]]
state = "punch"
mode = "once"
fps = 14.0
frames = '''
