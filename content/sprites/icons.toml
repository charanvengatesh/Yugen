# Item icons. Referenced by `item.icon` (a lenient `ref?(sprite)`), so an item
# with no entry here still renders — it falls back to its flat `color` swatch,
# which is what all 66 items had before this file existed.
#
# ---- THE GRAIN --------------------------------------------------------------
# One art pixel is one world cell everywhere else in this game, and an icon has
# no world to be measured against — its only physical constraint is the 26px
# hotbar well and `icon_scale`'s integer-only magnification. Everything here is
# 8x8, which renders at 3x = 24px in the well: the same on-screen size the old
# 3x3 icons had at 8x, so the resize cost nothing in the HUD and bought 64
# pixels of art per icon.
#
# This file used to argue that "nothing needs more than nine pixels, and
# everything that tried to use more stopped reading as part of the same game."
# That was true, and then the game it had to read as part of changed: the
# player grew from six art pixels to twenty, and a nine-pixel icon next to a
# twenty-pixel character became the coarse thing in the frame. The coarseness
# an icon must match is the game's, not the cell grid's, and it moved. 13x13
# (2x = 26px, filling the well exactly) is the ceiling if it ever moves again.
#
# What survived the resize, because it was never about resolution: every
# subject carries a 1px ink outline (#16121e, index 1 in every record) so the
# silhouette reads on any background; everything is lit from the upper-left
# like every lit edge in this game; and SPARKLE IS VALUE — a plus-shaped glint
# on the precious, a single bright pixel on metals, nothing on organics.
# Emissives carry a dim halo colour placed OUTSIDE the outline, two cells and
# no more; a halo that fills the well stops being a halo.
#
# ---- WHY ONE `icon_block_cube` FOR TWO DOZEN ITEMS --------------------------
# Roughly twenty-four items are `category placeable` and differ from each other
# in exactly one respect: which block they put down. Twenty-four hand-drawn
# cubes would be twenty-four copies of the same three-tone lump, and the moment
# one of them was redrawn the set would start to drift. They share this one
# sprite instead, drawn in a NEUTRAL grey specifically so a multiplicative tint
# by the item's own `color` lands where it should — which is the natural next
# step for the HUD, and is the same trick MobSprite's VARIANT_TINT already uses
# to make a crowd of one species read as individuals.
#
# ---- SHAPE VOCABULARY -------------------------------------------------------
# Repeated deliberately, so a glance at a slot says what KIND of thing is in it
# before it says which one:
#
#   rock lump, embedded glints      ore, unsmelted
#   trapezoid, lit top              a bar
#   flask (narrow neck, wide body)  anything with a `use.effect`
#   bowl (mass over a rim)          anything that only heals
#   head-over-shaft                 a tool or a torch
#
# Colours are lifted from the item's own `color` so the icon and the fallback
# swatch are the same object at two resolutions.

# =============================================================================
# The shared placeable cube
# =============================================================================
# Still the only icon the game draws two dozen times, and still NEUTRAL grey so
# a multiplicative tint by the item's own `color` lands where it should. At 8x8
# it stops being a three-tone lump and becomes an actual box: a lit top face, a
# mid left face, a dark right face, and a 1px ink outline that keeps the
# silhouette after the tint has pushed every grey toward one hue. Lit from the
# upper left, which is where every other lit edge in this game comes from (see
# `edge` in content/blocks/*.block); the single bright pixel at the top-left
# corner of the top face is the one that survives the darkest tint.
[icon_block_cube]
cellsW = 8
cellsH = 8
pal = [".", "#16121e", "#5c5c66", "#8a8a95", "#b4b4c0", "#dcdce6"]
[[icon_block_cube.seq]]
frames = '''
..1111..
.154441.
15444441
13332221
13332221
13332221
13332221
.111111.
'''


# =============================================================================
# Tools — the progression ladder, and the icons the player stares at longest
# =============================================================================
# One shape, five metals. The pickaxe is the only item in the game whose tiers
# are a ladder the player is consciously climbing, so the tiers differ ONLY in
# the palette and the five `frames` blocks are byte-identical: what you are
# meant to read off the slot is "which metal", not "which shape".
#
# At 8x8 the shape is finally worth drawing. Every tier is:
#
#   rows 0-2   the head — a wide arc, crown lit, prongs falling away either side
#   row  3     the prong tips, and the binding where the head meets the haft
#   rows 4-7   the haft, stepped one cell right at row 6 so it reads as raked
#
# Index 8 is the glint, and it is the ONE knob the tier ladder is allowed to
# turn other than the metal itself. On the mundane three it is just a lighter
# step of the same metal and barely reads; on gold and gem it is nearly white
# and catches the eye across a full hotbar. Sparkle is value, so it is spent
# where value is — but it is spent in the PALETTE, not the drawing, because the
# drawing is not permitted to move between tiers.

