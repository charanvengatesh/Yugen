66......
884444..
884444..
662222..
6.2222..
...22...
....1...
'''

# --- wallSlide --------------------------------------------------------------
# The wall-side overhang is dropped and so is the front half of the body: the
# figure squeezes into cols 4-5 — two texels, ONE CELL — pressed against the wall
# it faces, with only the dragging arm in col 3 and the mane behind it. Cols 6-7
# are empty because that is where the wall is; cols 0-1 are empty because there
# is nothing out there to reach for. A three-texel silhouette over a one-cell
# core is unlike anything else in the set, so this state is never ambiguous — and
# it is the only state that reads NARROWER than the hitbox, which is the honest
# way to say the character is pinned.
#
# Second frame: the braced foot loses the wall and the mane drifts back a texel.
# Everything else holds, so it slides rather than animates.
[[player.seq]]
state = "wallSlide"
mode = "loop"
fps = 6.0
frames = '''
...8....
...88...
....44..
....84..
...722..
...722..
....22..
....11..

..8.....
..88....
....44..
....84..
...722..
...722..
....22..
........
'''

# --- swim -------------------------------------------------------------------
# The figure goes prone: rows 4 and 5 are one horizontal line the full width of
# the frame — mane trailing off the back, a lit back over a shaded belly, then
# the head reaching forward into cols 4-7 with the amber tucked under its jaw —
# and that line does not change a texel across the whole sequence. The legs are
# the animation, trailing off the back in the depth tone. Feet never plant; no
# ink appears in this state at all.
#
# Three beats (glide with the legs straight back, gather with the knees drawn up
# under the hips, kick with the stroke blurred across six texels) played
# [A, B, C, B], so the gather frame appears twice and the stroke has a returning
# half. A bubble breaks off above the head on the glide and again, further
