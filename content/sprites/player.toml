# The player. No longer transcribed from src/entities/PlayerSprite.ts — this is
# the first version of the character that the TypeScript original never had, and
# the ARCHITECTURE-ts-reference.md drawing is now history rather than the target.
# What did not change is who owns it: the twelve states the movement code can
# produce and the twelve sequences that exist here are still the same list by
# construction, generated from this file, so `AnimState` cannot drift from the
# sequence table sitting below it.
#
# ---- ONE ART PIXEL IS ONE WORLD CELL ---------------------------------------
# 4x5 cells = 20x25px at CELL_SIZE 5. THE PIXELS DID NOT GET FINER. One art
# pixel is still exactly one sim cell; there are simply twenty of them where
# there were six. The art used to be a 16x16 grid squeezed into the collision
# box — a sprite pixel was 1.25 x 1.5 world px, four times finer than the sim
# cell and not even square, so the character read as a smooth hi-res figure
# pasted onto a chunky cellular world. That is still the thing this file cannot
# express, and growing the grid is not a way back to it.
#
# ---- THE COLLISION BOX DID NOT MOVE ----------------------------------------
# The box is still 2x3 cells (10x15px). The engine derives the surplus:
#
#   pad_x   = (4 - 2) / 2 * CELL_SIZE =  5px each side
#   pad_top = (5 - 3)     * CELL_SIZE = 10px above
#
# so the FEET stay on the bottom row and everything extra grows up and sideways.
# In this grid:
#
#   rows 2,3,4  x  cols 1,2   THE HITBOX. Head, torso, feet. What gets hit.
#   rows 0,1                  overhang above the head — mane, a thrown fist.
#   cols 0,3                  overhang either side — arms, a swung leg, a trail.
#
# An EVEN `cellsW` is a choice here, not a requirement, and it is worth knowing
# which. `ArtGrid::from_def` computes `pad_x` in f32 and a half-cell origin is
# explicitly legal for the player — `player_art.rs` says so and
# `an_odd_horizontal_surplus_lands_the_origin_on_a_half_cell` pins it — because
# forcing a whole cell would push the figure visibly off centre instead. (Mobs
# are the opposite: `mobs::defs` PANICS on an odd surplus. Do not carry that rule
# across.) 4 is used because two symmetric overhang columns give the arms
# somewhere to go, not because 3 was forbidden.
#
# ---- WHAT TWENTY PIXELS BUY THAT SIX COULD NOT -----------------------------
# At 2x3 the character had no silhouette, no limbs, and a head that was also its
# entire upper body. Four things arrived with the extra fourteen:
#
#   ARMS.       Cols 0 and 3 hold a limb. A cocked fist, a brace, a flail. The
#               punch now throws something instead of recolouring a pixel.
#   A MANE.     A trailing flame (tone 8) above and behind the head. It lags the
#               body, so every state gets secondary motion for one pixel: it
#               blows forward in the skid, streams flat back in the dash, whips
#               back on the punch, gutters out on the blink.
#   DEPTH.      Tone 7 is the far side of the figure. Limbs that reach into the
#               overhang columns are drawn in it, so the bright teal core — which
#               IS the hitbox — stays the brightest mass in the frame and the
#               silhouette never claims to be wider than the box.
#   A REAL SQUASH AND A REAL ROTATION. `land` loses a row AND spreads to four
#               cells wide. `doubleJump` rolls the head all the way around the
#               body instead of nudging it one cell.
#
# ---- ROW 0 IS SPENT, NOT OWNED ---------------------------------------------
# Only jump's launch, hurt, dash's trail and the doubleJump roll touch row 0. An
# early pass drew the mane up there on every frame and put an arm in cols 0 and
# 3 permanently; the figure then read as a 4x5 solid, and 4x5 is two and a half
# times the box. Players stop trusting gaps they can actually fit through, which
# is a movement bug caused entirely by art. The resting silhouette is therefore
# three cells wide and four tall (mane + one hanging arm), and the full 4x5
# extent exists only in states that last two or three frames.
#
# Authored facing RIGHT; left is a horizontal flip at draw time. Transparency
# still does most of the acting: dropping row 4 lifts the figure off the ground,
# dropping cols 0 and 3 flattens it against a wall, dropping row 1 and pushing
# everything down squashes it on impact.
#
# ---- SHARED POSES ARE REPEATED, NOT NAMED ----------------------------------
# Several states legitimately land on the same drawing — run's low passing beat
# is the idle exhale, and so is land's and punch's recovery; doubleJump recovers
# onto run's far-foot contact, byte for byte. Those frames are written out again
# here rather than hoisted into a named intermediate: the runtime's bake cache is
# keyed on the frame text, so identical frames still share ONE baked canvas, and
# the file stays readable as a filmstrip instead of as a symbol table.

[player]
name = "Player"

cellsW = 4
cellsH = 5

# Twenty pixels are enough for shading but not for decoration, so every colour
# still has a job. Teal body + gold head is the identity and did not move — it is
# the loudest thing against dark grey-blue rock, brown earth and white snow, and
# an ember survives being one pixel where a face never could.
#
# Two are new, and both exist to make the overhang legible rather than to make
# the character prettier:
#
#   7 is the FAR SIDE. Anything reaching into cols 0 and 3 that is behind the
#     torso is drawn in it. It is one step below the body shade, dark enough to
#     sit back but still obviously the same material, so a splayed arm reads as
#     depth instead of as extra body — which is what keeps the drawing honest
#     about where the hitbox ends.
#   8 is the MANE, one step cooler than the ember. Drawn in 4 the crest competed
#     with the head for the brightest pixel and the face stopped being the focal
#     point; drawn in a body tone it read as a helmet. An amber says "this is the
#     same flame, further from the source", which is the only thing it has to say.
#
#   0 .        transparent            5 #ff6b57  ember blown red — hurt only
#   1 #1b1220  ink, planted feet      6 #fff3c4  spark — dash trail, punch
#   2 #3ec8b4  body lit (leading)                impact, swim bubble, skid
#   3 #21877e  body shade (trailing)             scrape, landing dust
#   4 #ffcf5c  ember head — the       7 #14564f  body deep — far-side limbs
#              bloom pass takes it    8 #e8913a  mane, the trailing flame
pal = [".", "#1b1220", "#3ec8b4", "#21877e", "#ffcf5c", "#ff6b57", "#fff3c4", "#14564f", "#e8913a"]

variants = 1

# Every sequence below sets its own rate, so the sprite-wide `fps` is never
# consulted; it is left at the schema default rather than authored to a lie.

# --- idle -------------------------------------------------------------------
# Ambient, not a loop: a slow breath with an occasional blink on top. The first
# two frames alternate at `fps` — exhale (chest on the shade tone, mane hanging
# straight down behind the head) and inhale (chest lifts onto both lit pixels,
# mane drifts back a cell). The trailing arm hangs in col 0 on the exhale and is
# the only overhang the resting figure spends.
#
# The LAST frame is the interrupt, held for blinkFor every blinkEvery. The whole
# flame guttering IS the blink — head AND mane drop to body shade, three pixels
# going dark at once where the old grid could only dim one. There is still no eye
# to close, and now there does not need to be.
#
# fps is written as the reciprocal of the authored beat, 1/0.62, and the exact
# double for it rather than a rounded 1.613. The runtime computes
# `beat = 1/fps` and then `floor(t / beat)`, and 1/(1/0.62) === 0.62 exactly in
# IEEE754, so the reciprocal round-trips bit-for-bit to the original
# IDLE_BREATH constant. 1.613 does not: it disagrees with the old
# PlayerSprite.idleFrame() on 91 of 600,000 samples over 60s.
[[player.seq]]
state = "idle"
mode = "ambient"
fps = 1.6129032258064517
blinkEvery = 4.6
blinkFor = 0.1
frames = '''
....
.8..
.44.
732.
.11.

....
88..
.44.
722.
.11.

....
.3..
.33.
732.
.11.
'''

# --- run --------------------------------------------------------------------
# Indexed by the run phase the Player advances from real horizontal speed, so
# contacts land on phase 0.0 and 0.5 — frames 0 and 2 — which is where the
# footstep particles are emitted. Both contacts now show a real stride, because
# a foot is allowed to leave the hitbox columns:
#
#   frame 0  NEAR-foot contact. The near foot plants forward in col 3 (ink), the
#            other trails under the body, and the far arm swings back into col 0.
#            Contralateral, which is what stops a run from reading as a hop.
#   frame 2  FAR-foot contact. The far foot plants in tone 7 and the arm swings
#            forward instead. Same cadence, opposite limbs, and the depth tone is
#            what says "other side of the body" rather than "smaller step".
#
# THE TWO PASSING BEATS ARE NOT THE SAME DRAWING. They used to be byte-identical,
# which made the cycle read A-B-C-B — a shuffle. Frame 1 is the HIGH pass: arms
# tuck in, the silhouette narrows to two cells, the chest goes to both lit pixels
# and one foot gathers under the hips. Frame 3 is the LOW pass and is the idle
# exhale exactly, arm out and both feet down. Near-side pass rides high, far-side
# rides low, which is what a run seen from one side actually does.
#
# The body tones are NOT swapped to `23` on either beat: that reversal is
# reserved for `skid`, where it means the weight is going the other way.
[[player.seq]]
state = "run"
mode = "phase"
frames = '''
....
.8..
.44.
732.
.1.1

....
88..
.44.
.22.
..1.

....
.8..
.44.
.322
1.7.

....
.8..
.44.
732.
.11.
'''

# --- skid -------------------------------------------------------------------
# The body tones are SWAPPED, so the lit side trails the facing: the figure faces
# the new direction while its weight still goes the old way, which is exactly
# what a turnaround is. The mane confirms it — it blows FORWARD across the face
# into col 3, because hair trails the motion and the motion is now backwards.
# That one cue is worth more than the tone swap on its own ever was.
#
# The far arm is flung out behind into col 0 as a brace. A spark flickers off the
# leading foot on the second frame and nothing else changes, so the state still
# reads as one fixed posture — it just stops being the only sustained state in
# the set that is completely static, which at ten frames a second is the
# difference between braking and being paused.
[[player.seq]]
state = "skid"
mode = "loop"
fps = 10.0
frames = '''
....
..88
.44.
723.
.11.

....
..88
.44.
723.
.116
'''

# --- jump -------------------------------------------------------------------
# Launch: the only frame in the file that is five rows tall. The leading arm goes
# up the whole front column — shoulder, forearm, hand in row 0 — the chest is on
# both lit tones, and the trailing foot is already gone. Maximum extension, and
# it survives being this large because `once` at 9fps means it exists for one
# ninth of a second and can never be mistaken for the resting silhouette.
#
# Then the tuck: the arm drops, the mane spreads as the rise slows, the knees
# come up and the figure loses two rows off the top.
[[player.seq]]
state = "jump"
mode = "once"
fps = 9.0
frames = '''
...2
.8.2
.442
.22.
..1.

....
.88.
.44.
.32.
..1.
'''

# --- doubleJump -------------------------------------------------------------
# The one move with a real animation, and now it is a real somersault rather than
# a nudged pixel. The body curls into a two-by-two ball inside the hitbox columns
# and stays there; the HEAD orbits it, with the mane one beat behind like a
# comet's tail:
#
#   frame 0  ember at top, mane behind it, and a spark kicked out underneath —
#            the mid-air push that paid for the jump.
#   frame 1  ember swung round to the front at torso height, mane above it.
#   frame 2  fully inverted: ember below the ball, mane trailing off the front.
#   frame 3  recovered, and it is run's far-foot contact BYTE FOR BYTE, so the
#            roll lands straight into the run cycle instead of stopping first.
#
# Nothing else in the set moves the head off row 2, so this cannot be confused
# with the first jump even at 12fps.
[[player.seq]]
state = "doubleJump"
mode = "once"
fps = 12.0
frames = '''
....
.84.
.22.
.33.
..6.

....
....
.228
.334
....

....
....
.22.
.338
..4.

....
.8..
.44.
.322
1.7.
'''

# --- fall -------------------------------------------------------------------
# A dim, loose body (both tones shaded) with the limbs doing the work. Three
# frames on a slow loop so it flails rather than vibrates, and the arms are what
# make it flail: back arm out and a leg swung forward, then BOTH arms thrown up
# to head height with both feet gone, then front arm out and the leg swung back.
# The middle frame is the one that has to drop both feet — the leg swings through
# empty air between the two contacts instead of teleporting from one side to the
# other. Two frames made the fall read as a metronome; the odd frame count is
# what makes it read as loose.
[[player.seq]]
state = "fall"
mode = "loop"
fps = 6.0
frames = '''
....
.88.
.44.
733.
..1.

....
.88.
7442
.33.
....

....
.88.
.44.
.332
1...
'''

# --- land -------------------------------------------------------------------
# Impact, and this is where the wide grid earns its keep. The figure loses BOTH
# overhang rows, the ember is crushed down a full row into row 3, the mane is
# forced up above it, the arms splay all the way to cols 0 and 3, and dust sparks
# out either side of the feet. Two rows shorter and two cells wider in a single
# frame — a squash that is actually a squash, where the old grid could only
# delete a row.
#
# Three beats: squash, RISE, neutral. The rise recovers the full height but keeps
# the body on the dim `33` it had while falling, so the figure comes back up
# before it comes back to strength. Cutting straight from the squash to the
# neutral stand made the recovery instantaneous, which threw away most of what
# the squash frame had just paid for. The last frame is the idle exhale exactly.
[[player.seq]]
state = "land"
mode = "once"
fps = 14.0
frames = '''
....
....
.88.
7442
6116

....
.8..
.44.
733.
.11.

....
.8..
.44.
732.
.11.
'''

# --- dash -------------------------------------------------------------------
# The pose is welded: mane blown dead flat behind the head along row 2, chest on
# both lit tones, one toe skimming. Nothing about the FIGURE moves between the
# frames — only the sparks in the back column, which is what makes it a streak
# rather than an animation.
#
# Three frames rather than two: an even count at this rate gives a 9Hz
# alternation that the eye locks onto as a flicker, where an odd one keeps
# re-landing on a different beat and stays a streak. Spark high, spark low, then
# both at once — the trail briefly doubling is what sells speed.
[[player.seq]]
state = "dash"
mode = "loop"
fps = 18.0
frames = '''
....
6...
844.
.22.
..1.

....
....
844.
622.
..1.

....
6...
844.
622.
..1.
'''

# --- wallSlide --------------------------------------------------------------
# Both overhang columns are dropped and so is col 1's body: the figure squeezes
# into the single cell column pressed against the wall it faces, with only the
# dragging arm and the mane behind it. Col 3 is empty because that is where the
# wall is. A two-wide, four-tall silhouette with a one-wide core is unlike
# anything else in the set, so this state is never ambiguous — and it is the only
# state that reads NARROWER than the hitbox, which is the honest way to say the
# character is pinned.
#
# Second frame: the braced foot loses the wall and the mane drifts back a cell.
# Everything else holds, so it slides rather than animates.
[[player.seq]]
state = "wallSlide"
mode = "loop"
fps = 6.0
frames = '''
....
.8..
..4.
.72.
..1.

....
88..
..4.
.72.
....
'''

# --- swim -------------------------------------------------------------------
# The figure goes prone: row 2 is one horizontal line — mane, back, then the head
# reaching forward into col 3 — and it does not change across the whole sequence.
# The legs are the animation, trailing off the back in the depth tone. Feet never
# plant; no ink appears in this state at all.
#
# Three beats (glide with the legs straight back, gather with the knees drawn up
# under the hips, kick with the stroke blurred across three cells) played
# [A, B, C, B], so the gather frame appears twice and the stroke has a returning
# half. A bubble breaks off above the head on the glide and again, further
# forward, on the kick.
[[player.seq]]
state = "swim"
mode = "loop"
fps = 6.0
frames = '''
....
..6.
8344
77..
....

....
....
8344
.72.
....

....
...6
8344
772.
....

....
....
8344
.72.
....
'''

# --- punch ------------------------------------------------------------------
# Wind-up: the body dims to the shade tone, the feet set, and the fist cocks back
# into col 0 on the LIT tone — the brightest pixel in the frame is the thing that
# is about to move, which is the whole trick for telegraphing at 14fps.
#
# Contact: the arm fires across the body and the front column flashes for two
# rows, mane whipped back to col 0 by the turn. That vertical spark bar is the
# only two-pixel spark in the file outside the dash trail, and it is deliberately
# outside the hitbox — the strike reaches further than the character can be hit,
# which is exactly what the overhang column is for.
#
# Recovery is the idle exhale exactly. Feet never move across all three frames.
[[player.seq]]
state = "punch"
mode = "once"
fps = 14.0
frames = '''
....
.8..
.44.
233.
.11.

....
8...
.446
.326
.11.

....
.8..
.44.
732.
.11.
'''

# --- hurt -------------------------------------------------------------------
# Four things change at once, which is right for the state you most need to read
# instantly. The ember blows red and takes the mane with it, so the red is now a
# five-pixel diagonal streak torn up and back through both overhang rows instead
# of one recoloured dot. The body tones reverse. The arm flies out behind. The
# leading foot leaves the floor.
#
# It is the only frame in the file that puts a colour nothing else uses into row
# 0, so it is unmistakable even in one held frame at the edge of vision.
[[player.seq]]
state = "hurt"
mode = "hold"
frames = '''
5...
55..
.55.
723.
.1..
'''
