# Creature drops — the ids named by `drops` in content/mobs/*.mob.
#
# The mob schema is another agent's; these exist so its drop tables resolve
# against a real registry instead of warning, and so killing something is worth
# as much as breaking something. Everything here feeds back into a recipe that
# already existed, rather than sitting in the inventory as a trophy:
#
#   slime_gel           -> sticky mud, i.e. wall-grip terrain, without a swamp
#   chitin              -> the only non-metal route to a bounce pad
#   grub_meat, spore_sac-> field food
#   moth_dust, bat_wing -> the light and haste draughts
#   ember_core          -> the fire ward, which the README owes the volcano
#   frozen_core         -> permafrost by the stack, deep in the warm bands
#
# hide and worm_hide have no recipe yet on purpose: they are the armour tier's
# input, and there is no armour. They still stack, sell and take a slot, which is
# enough for them to exist honestly rather than as a dead id.

[slime_gel]
name = "Slime Gel"
category = "material"
color = [104, 196, 128]
icon = "icon_gel"
stack = 99
value = 6
desc = "Still faintly warm, and still faintly moving."
tags = ["plant"]

