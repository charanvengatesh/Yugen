texture = "speckle"
edge = 150
density = 3.1
emissive = 0.12
hardness = 5.5
blastResist = 2.5
tags = ["rock", "ore", "diggable"]
heat.conduct = 78
drop = [{ item = "gold_ore", count = 1 }]

[gemOre]
