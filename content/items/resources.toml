# --- Smelted bars ----------------------------------------------------------
#
# Three ore to one bar across the board, so the ratio never has to be looked up,
# and one coal per smelt so the coal seams you pass on the way down stay useful
# instead of becoming clutter.

[copper_bar]
name = "Copper Bar"
category = "material"
color = [196, 124, 76]
icon = "icon_bar_copper"
stack = 99
value = 28
desc = "Soft metal, honest tools."
tags = ["bar"]
craft = [{ in = ["copper_ore", "coal"], n = [3, 1], out = 1, station = "furnace" }]

[iron_bar]
name = "Iron Bar"
category = "material"
color = [176, 172, 168]
icon = "icon_bar_iron"
stack = 99
value = 50
desc = "Holds an edge long enough to matter."
tags = ["bar"]
craft = [
    { in = ["iron_ore", "coal"], n = [3, 1], out = 1, station = "furnace" },
# The salvage route. Two scrap for one bar against three ore for one is the
# better ratio on purpose: killing a bladeframe should be worth more than the
# seam you walked past, or nobody will ever fight one twice.
    { in = ["machine_scrap", "coal"], n = [2, 1], out = 1, station = "furnace" },
]

[gold_bar]
name = "Gold Bar"
category = "material"
color = [224, 194, 96]
icon = "icon_bar_gold"
stack = 99
value = 102
desc = "Heavy, bright, and far better at carrying a charge than a blow."
tags = ["bar"]
craft = [{ in = ["gold_ore", "coal"], n = [3, 1], out = 1, station = "furnace" }]
