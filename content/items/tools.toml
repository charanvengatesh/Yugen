# Pickaxes — the progression ladder.
#
# TUNING. `digPower` is compared against MAT_HARDNESS as a HARD GATE, not a speed
# penalty: over the line the cell does not break at all. So each rung is set just
# past exactly one ore in content/blocks/ores.block and just short of the next,
# which makes every upgrade a specific door rather than a vague number going up.
#
#   hardness:  stone 3 · basalt 3.5 · coal 4 · copper 4.5 · iron 5 · crystal 5
#              gold 5.5 · gem 6 · obsidian 9 · liquids and gases Infinity
#
#   traveler 4.6  -> copper is the deepest thing you own, iron is the wall
#   copper   5.2  -> iron and crystal open
#   iron     5.8  -> gold opens
#   gold     6.4  -> gem opens
#   gem      10   -> obsidian opens; nothing left but the unbreakables
#
# The starter clears copper on purpose. A ladder whose first rung needs copper to
# craft and copper to mine is not a ladder, and bare hands (digPower 0.5 — see
# HANDS in src/tools/BuildTool.ts) only get you leaves, moss, ash, snow and sand.
#
# digSpeed / reach / brushMax rise together so a late pick FEELS different even
# on stone you could already break: ~3x the cadence, twice the reach, and a bite
# of 49 cells instead of 5.

[pick_traveler]
name = "Traveler's Pick"
category = "tool"
color = [134, 118, 96]
icon = "icon_pick_traveler"
stack = 1
tier = 0
value = 20
desc = "Worn handle, chipped head. It was somebody else's first, too."
tags = ["pickaxe"]
tool.digPower = 4.6
tool.digSpeed = 1.0
tool.reach = 5
tool.brushMax = 1

