# Ore is stone with a tell: same density and heat behaviour as the rock it
# replaces, distinguished by colour and a high-ish colorVar so a vein reads as
# flecks in rock rather than a painted blob. Values ascend with depth, and so do
# hardness and the tier of tool a player needs to take them out.
#
# The metals conduct above the 64 stability ceiling documented on heat.conduct.
# That is deliberate: a copper vein should carry a lava front further than the
# stone around it, and the diffusion step is clamped, not unbounded.

[coalOre]
name = "Coal Ore"
state = "solid"
color = [52, 48, 52]
colorVar = 22
texture = "speckle"
edge = 145
density = 2.4
hardness = 4.0
blastResist = 2.0
tags = ["rock", "ore", "diggable"]
flammable.igniteChance = 0.05
flammable.burnTime = 220
flammable.burnsInto = "ash"
heat.conduct = 40
heat.igniteAt = 120
drop = [{ item = "coal", count = [1, 2] }]

[copperOre]
name = "Copper Ore"
state = "solid"
color = [156, 104, 66]
colorVar = 24
texture = "speckle"
edge = 145
density = 2.6
hardness = 4.5
blastResist = 2.0
tags = ["rock", "ore", "diggable"]
heat.conduct = 70
drop = [{ item = "copper_ore", count = 1 }]

[ironOre]
name = "Iron Ore"
state = "solid"
color = [146, 128, 118]
colorVar = 24
texture = "speckle"
edge = 145
density = 2.8
hardness = 5.0
blastResist = 2.5
tags = ["rock", "ore", "diggable"]
heat.conduct = 66
drop = [{ item = "iron_ore", count = 1 }]

# Gold glints on its own (emissive 0.12 derives lightEmit 1) — enough to catch
# the eye in a torchlit shaft without lighting the shaft.
[goldOre]
