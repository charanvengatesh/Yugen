[package]
name = "godgame-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The engine: config, cell sim, worldgen, entities, physics, items. No Bevy, no wgpu, no windowing."

[dependencies]
godgame-data.workspace = true
bitflags.workspace = true
rayon.workspace = true

[dev-dependencies]
criterion.workspace = true
serde_json = "1"

# The worldgen microbench is a criterion binary, not a libtest one: chunk
# generation is measured in microseconds and libtest's timer cannot see it.
[[bench]]
name = "worldgen"
harness = false
