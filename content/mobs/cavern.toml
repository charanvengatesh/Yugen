# --- Cinder moth ------------------------------------------------------------
# A flyer for the volcanic surface and the hot shallows: it glows, it is immune
# to fire (it nests in it), and it spits embers rather than closing, so it is
# the first creature that punishes you for standing on open ground. Nocturnal,
# because a moth you can see coming is not a moth.
[cinder_moth]
name = "Cinder Moth"
brain = "flyer"
maxHealth = 12.0
contactDamage = 5.0
attackCooldown = 0.8
bodyCellsW = 3
bodyCellsH = 2
speed = 180.0
chaseSpeed = 300.0
gravityScale = 0.0
aggroPx = 185.0
aggroYPx = 120.0
beat = 1.1
glow = 0.35
immune = ["fire"]
blood = "#ff7a2c"
ranged.projectile = "ember"
ranged.cooldown = 2.2
ranged.range = 190.0
ranged.damage = 7.0
xp = 8
value = 4
drops = [
    { item = "ash_pile", count = [1, 2] },
    { item = "moth_dust", count = 1, chance = 0.3 },
]
bands = ["surface", "shallow", "cavern"]
biomes = ["volcanic", "desert", "savanna"]
nocturnal = true
weight = 11.0
# The interrupt frame is the fifth palette entry and nothing else in the sprite
# ever uses it: the wings go white-hot for a tenth of a second, which is the
# tell that an ember is coming. That is the single most useful thing `ambient`
# bought this file — a ranged attacker that telegraphs, without a line of code.
# `grain = 2` makes the tell a FLARE rather than a recolour: the white runs from
# the tips inward along the membrane (six texels of 5) instead of swapping two
# cells, and because `glow 0.35` draws a second additive pass from the same
# tile, those six texels are the ones that actually bloom. Same reason the gold
# (4) is still rationed to tips and the spread frame — on a glower, brights are
# spent twice. The extra rows also give the wing real travel: up at row 0, dark
# and edge-on across the middle, fully spread at the thorax line. No palette
# change, deliberately — 5 sits at the top of a five-step ramp and any tone
# appended above or beside it would blunt the one frame that matters.
art.cellsW = 3
art.cellsH = 2
art.grain = 2
art.pal = [".", "#3a1408", "#4a1e10", "#ff7a2c", "#ffd68a", "#fff2c8"]
art.fps = 13.0
[[cinder_moth.art.seq]]
state = "idle"
mode = "ambient"
blinkEvery = 2.4
blinkFor = 0.1
frames = '''
44..44
.3333.
..33..
..11..

......
22..22
.2332.
..11..

55..55
.5335.
..33..
..11..
'''
[[cinder_moth.art.seq]]
