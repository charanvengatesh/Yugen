[package]
name = "yugen-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authoring tools for content/: the splice that edits a record without rewriting its file."
publish = false

# Deliberately thin. The one dependency is the TOML front end `contentc` already
# uses, and it is used to LOCATE records — never to write them. See
# `src/splice.rs` for why a serializer is the wrong tool here.
[dependencies]
toml = "0.9"
